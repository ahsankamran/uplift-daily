<!doctype html>
<!--
  IG card template — 1080×1350 (4:5 portrait).

  Two ways to render:
    1. Open with no hash → shows the placeholder card below (preview only)
    2. Open with #<urlencoded JSON> in the URL — the render-cards.mjs script
       passes story data this way. The shape is:
         { edition, date, n, total, story: { cat, place, head, src, img } }
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Card template</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root { --accent: oklch(58% 0.12 55); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #2b241a; font-family: "Spectral", Georgia, serif; -webkit-font-smoothing: antialiased; }
body { display: grid; place-items: center; min-height: 100vh; }

.card {
  width: 1080px; height: 1350px;
  position: relative;
  background: #000;
  color: #fff;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  background-color: #2c2419;
  filter: brightness(0.72) saturate(1.05);
  transform: scale(1.02);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.55) 65%, rgba(0,0,0,0.92) 100%);
}
.card .frame {
  position: absolute; inset: 36px;
  border: 1px solid rgba(255,255,255,0.18);
  pointer-events: none;
}

.top {
  position: absolute; top: 64px; left: 64px; right: 64px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: "IBM Plex Sans", sans-serif;
  font-size: 22px; letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(255,255,255,0.85);
}
.wordmark {
  font-family: "Spectral", serif;
  font-size: 38px; letter-spacing: 0.18em; font-weight: 500;
}
.wordmark .sun { display: inline-block; width: 0.5em; height: 0.25em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em 0; }

.body {
  position: absolute; left: 64px; right: 64px; bottom: 64px;
}
.num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 64px; height: 64px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: "Spectral", serif; font-style: italic; font-size: 34px;
  margin-bottom: 24px;
}
.kicker {
  font-family: "IBM Plex Sans", sans-serif;
  font-size: 22px; letter-spacing: 0.22em; text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 18px;
}
.headline {
  font-family: "Spectral", serif;
  font-weight: 500;
  font-size: 72px;
  line-height: 1.06;
  letter-spacing: -0.012em;
  text-wrap: balance;
  margin-bottom: 32px;
  text-shadow: 0 2px 30px rgba(0,0,0,0.5);
}
.src-row {
  display: flex; justify-content: space-between; align-items: center;
  font-family: "IBM Plex Sans", sans-serif;
  font-size: 22px; letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(255,255,255,0.9);
  padding-top: 22px;
  border-top: 1px solid rgba(255,255,255,0.25);
}
.src-row .arrow { color: var(--accent); }
</style>
</head>
<body>

<article class="card">
  <div class="bg" id="bg"></div>
  <div class="scrim"></div>
  <div class="frame"></div>

  <header class="top">
    <span class="wordmark">Upl<span class="sun"></span>ft</span>
    <span id="edition">Edition —</span>
  </header>

  <div class="body">
    <div class="num" id="num">1</div>
    <div class="kicker" id="kicker">Preview · No story passed</div>
    <h1 class="headline" id="headline">Open this template with a story payload in the URL hash.</h1>
    <div class="src-row">
      <span id="src">Source: —</span>
      <span>uplift.daily &nbsp;<span class="arrow">→</span></span>
    </div>
  </div>
</article>

<script>
(function () {
  // Payload comes in the URL hash as URL-encoded JSON.
  const raw = location.hash.replace(/^#/, "");
  if (!raw) return;
  let data;
  try { data = JSON.parse(decodeURIComponent(raw)); } catch (e) { return; }
  const s = data.story || {};
  document.getElementById("num").textContent = data.n || 1;
  document.getElementById("kicker").textContent =
    [s.cat, s.place].filter(Boolean).join(" · ") || "Uplift";
  document.getElementById("headline").textContent = s.head || "";
  document.getElementById("src").textContent = "Source: " + (s.src || "—");
  document.getElementById("edition").textContent = "Edition " + (data.edition || "—");
  if (s.img) {
    document.getElementById("bg").style.backgroundImage = `url("${s.img}")`;
  }
})();
</script>
</body>
</html>
