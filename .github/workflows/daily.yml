name: Daily edition

on:
  schedule:
    # 14:00 UTC = 07:00 PT (PDT). Adjust if you want a different deliver time.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish even if a card fails visual review"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node (for card rendering)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Puppeteer (for IG cards)
        run: |
          npm init -y >/dev/null
          npm install --no-save puppeteer@22

      - name: git identity for this job's commits
        run: |
          git config user.name "uplift-bot"
          git config user.email "bot@uplift.daily"
          mkdir -p .qa

      # ============================================================
      # COMBINED DIGEST — the flagship product. All-or-nothing: if
      # anything below fails this edition's QA, the job exits before
      # ever pushing, so Claude's local commit here simply never
      # leaves this ephemeral runner. No revert needed.
      # ============================================================

      - name: Run Claude Code — combined digest
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5 --allowedTools Bash,Read,Write,Edit,WebSearch,WebFetch"
          # Verbose on purpose: a run on 2026-10-01..03 reported clean success
          # (is_error: false, real work done) while silently never writing a
          # new issues/index.json entry. Redacted-by-default output made that
          # undiagnosable after the fact.
          show_full_output: true
          prompt: |
            You are the editor for the day. Read CLAUDE.md and DAILY.md
            in this repo, then produce today's edition following the
            instructions in DAILY.md. When done, commit (do NOT push —
            DAILY.md Step 6 explains why) with the message
            "Edition NNN — YYYY-MM-DD" where NNN is the new edition
            number. Do not skip steps. Do not invent facts — only use
            stories you can verify via web search.

      # A run can report clean success without ever having written
      # today's entry — seen live on 2026-10-01 through 10-03, three
      # days straight, silently. render-cards.mjs falls back to the
      # newest existing entry rather than erroring, so nothing
      # downstream would have caught it on its own.
      - name: Verify today's combined digest was actually written
        run: |
          TODAY="$(date -u +%Y-%m-%d)"
          NEWEST=$(node -e '
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync("issues/index.json", "utf8"));
            const list = Array.isArray(d) ? d : d.issues || [];
            const dates = list.map((x) => x.date).filter(Boolean).sort();
            process.stdout.write(dates[dates.length - 1] || "");
          ')
          echo "today (UTC): $TODAY — newest entry in issues/index.json: ${NEWEST:-none}"
          if [ "$NEWEST" != "$TODAY" ]; then
            echo "::error::No edition for $TODAY was written to issues/index.json (newest is ${NEWEST:-none}). See the 'combined digest' step output above for what it actually did."
            exit 1
          fi

      # index.html/archive.html are rewritten from scratch each morning, so
      # the category section bar would vanish on any day Claude didn't happen
      # to carry it over. This re-inserts it idempotently instead of relying
      # on the rewrite to preserve it.
      - name: Re-inject the category section bar
        run: |
          node scripts/inject-section-nav.mjs
          git add index.html archive.html
          git commit -m "Section bar — $(date -u +%Y-%m-%d)" || true

      - name: Tier 1 QA — combined digest
        run: node scripts/qa-edition.mjs "$(date -u +%Y-%m-%d)"

      - name: Render combined digest's IG cards
        run: node scripts/render-cards.mjs

      # ============================================================
      # THREE NEW CATEGORIES — independent of the combined digest and
      # of each other. Each writes but does not commit; a bad one is
      # discarded on its own (git checkout/clean below) without
      # touching the combined digest or the other two.
      # ============================================================

      - name: Run Claude Code — Coming Together
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5 --allowedTools Bash,Read,Write,Edit,WebSearch,WebFetch"
          show_full_output: true
          prompt: |
            Read editions/coming-together/DAILY.md and CLAUDE.md in this
            repo, then produce today's Coming Together edition following
            those instructions exactly, including the photo-matching
            standard in Step 3. Stop after Step 5 (Step 6 tells you not
            to commit — the workflow handles that).

      - name: Run Claude Code — Open Hands
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5 --allowedTools Bash,Read,Write,Edit,WebSearch,WebFetch"
          show_full_output: true
          prompt: |
            Read editions/open-hands/DAILY.md and CLAUDE.md in this repo,
            then produce today's Open Hands edition following those
            instructions exactly, including the photo-matching standard
            in Step 3. Stop after Step 5 (Step 6 tells you not to commit
            — the workflow handles that).

      - name: Run Claude Code — Human Spirit
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5 --allowedTools Bash,Read,Write,Edit,WebSearch,WebFetch"
          show_full_output: true
          prompt: |
            Read editions/human-spirit/DAILY.md and CLAUDE.md in this
            repo, then produce today's Human Spirit edition following
            those instructions exactly, including the suffering-as-setup
            risk and the photo-matching standard in Step 3. Stop after
            Step 5 (Step 6 tells you not to commit — the workflow
            handles that).

      - name: Tier 1 QA — the three new categories
        run: |
          TODAY="$(date -u +%Y-%m-%d)"
          for slug in coming-together open-hands human-spirit; do
            if node scripts/qa-edition.mjs "$TODAY" "$slug"; then
              echo pass > ".qa/tier1-$slug.status"
            else
              echo fail > ".qa/tier1-$slug.status"
              echo "::warning::$slug failed Tier 1 QA (or found no story) for $TODAY — will not be committed today."
            fi
          done

      - name: Render sample cards for new categories that passed Tier 1
        run: |
          TODAY="$(date -u +%Y-%m-%d)"
          for slug in coming-together open-hands human-spirit; do
            if [ "$(cat ".qa/tier1-$slug.status" 2>/dev/null)" != "pass" ]; then
              echo "skip $slug — did not pass Tier 1"
              continue
            fi
            # Tier 1 passing already guarantees this entry exists; the
            # `|| continue` is just defensive so one unexpected failure
            # here can't (under this script's implicit -e) abort rendering
            # for the other two slugs.
            node -e '
              const fs = require("fs");
              const slug = process.argv[1];
              const date = process.argv[2];
              const m = JSON.parse(fs.readFileSync(`editions/${slug}/issues/index.json`, "utf8"));
              const entry = m.find((e) => e.date === date);
              if (!entry) process.exit(1);
              fs.writeFileSync(`.qa/${slug}-story.json`, JSON.stringify(entry));
            ' "$slug" "$TODAY" || continue
            node scripts/render-sample-card.mjs "$slug" "$slug" ".qa/$slug-story.json" || continue
          done

      # ============================================================
      # TIER 2 — TWO independent vision passes over everything
      # rendered so far: the combined digest's 6 feed cards plus
      # whichever new categories passed Tier 1.
      #
      # Two passes, not one, because this review is demonstrably
      # non-deterministic: on 2026-10-04 two runs over identical cards
      # disagreed, and the pass that caught the real defect (a
      # commercial landscaping crew illustrating a story about unpaid
      # neighbourly help) was the second one. A single pass would have
      # shipped it. Each pass writes its own report and a later step
      # fails a card if EITHER pass fails it — the union of findings,
      # so a miss in one run is covered by the other.
      # ============================================================

      - name: Tier 2 QA — visual review (pass 1)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5 --allowedTools Read,Bash"
          prompt: |
            Read scripts/qa-visual-review.md and follow its procedure and
            "Automated contract" section exactly. Run `date -u +%Y-%m-%d`
            yourself via Bash to get today's date — use that for every
            path below.

            Review today's combined digest: the 6 feed cards at
            cards/<today>/feed/*.png, matched against issues/index.json's
            entry for today (cat/place/head per card, in order).

            Also review each new-category sample card that exists at
            cards/_samples/<slug>.png for slug in coming-together,
            open-hands, human-spirit (a missing file means that one
            didn't pass Tier 1 — skip it, don't report an entry for it),
            matched against that slug's editions/<slug>/issues/index.json
            entry for today.

            Write your verdict to .qa/tier2-report-1.json in exactly the
            JSON shape the contract specifies. This is the only file you
            should write.

      # Deliberately a fresh invocation with no knowledge of pass 1 — the
      # point is an independent second opinion, so it must not be able to
      # anchor on the first one's verdicts.
      - name: Tier 2 QA — visual review (pass 2)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5 --allowedTools Read,Bash"
          prompt: |
            Read scripts/qa-visual-review.md and follow its procedure and
            "Automated contract" section exactly. Run `date -u +%Y-%m-%d`
            yourself via Bash to get today's date — use that for every
            path below.

            Review today's combined digest: the 6 feed cards at
            cards/<today>/feed/*.png, matched against issues/index.json's
            entry for today (cat/place/head per card, in order).

            Also review each new-category sample card that exists at
            cards/_samples/<slug>.png for slug in coming-together,
            open-hands, human-spirit (a missing file means that one
            didn't pass Tier 1 — skip it, don't report an entry for it),
            matched against that slug's editions/<slug>/issues/index.json
            entry for today.

            Judge every card yourself from the images. Do not read
            .qa/tier2-report-1.json or any other existing verdict file —
            this is an independent second opinion and must not be
            influenced by another reviewer's conclusions.

            Write your verdict to .qa/tier2-report-2.json in exactly the
            JSON shape the contract specifies. This is the only file you
            should write.

      # Merge the two passes: a card ships only if BOTH passed it. Either
      # reviewer failing something is enough to block, since the 2026-10-04
      # incident showed a real defect visible to only one of two passes.
      - name: Merge the two Tier 2 passes
        run: node scripts/merge-tier2.mjs 6

      # Without this, a reviewer malfunction is invisible: the reports live
      # only on the runner, the job dies, and there is nothing to inspect.
      # That is how a one-line shape mismatch discarded every edition from
      # 2026-10-05 to 10-31 while every step before it reported success.
      - name: Upload QA reports for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: .qa/
          retention-days: 14
          if-no-files-found: warn

      - name: Evaluate QA verdicts and commit what passed
        env:
          FORCE_PUBLISH: ${{ inputs.force_publish && '1' || '0' }}
        run: |
          TODAY="$(date -u +%Y-%m-%d)"
          node scripts/evaluate-qa.mjs

          # The combined digest was already committed by its own step; if
          # evaluate-qa.mjs exited non-zero we never reach here, so nothing
          # gets pushed. No revert needed — the runner is thrown away.
          for slug in coming-together open-hands human-spirit; do
            if [ "$(cat ".qa/final-$slug.status" 2>/dev/null)" = "pass" ]; then
              git add "editions/$slug/"
              git commit -m "$slug — $TODAY" || true
            else
              git checkout -- "editions/$slug/" 2>/dev/null || true
              git clean -fd "editions/$slug/" 2>/dev/null || true
            fi
          done

      # ============================================================
      # PHASE 2 — derive the 6 category editions from the (now
      # QA-approved) combined digest. No new sourcing, no separate QA:
      # it's the same story/photo that already passed Tier 2 above,
      # just repackaged.
      # ============================================================

      - name: Derive the 6 category editions
        run: |
          node scripts/build-category-editions.mjs "$(date -u +%Y-%m-%d)"
          git add editions/quiet-kindness/ editions/small-wonders/ editions/everyday-joy/ editions/nature/ editions/science-medicine/ editions/global-progress/
          git commit -m "Derived category editions — $(date -u +%Y-%m-%d)" || true

      # cards/ was already rendered earlier (before Tier 2 needed to look
      # at it) and is gitignored repo-wide, so this is just staging
      # whatever's already on disk — no need to render again.
      - name: Commit cards (only — never node_modules)
        run: |
          git add cards/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Cards — $(date -u +%F)" || true
          fi

      - name: Push everything
        run: git push

      # Belt-and-suspenders: confirm the push actually landed, not just
      # that this ephemeral checkout thinks it did.
      # NOTE: do not call scripts/alert.sh here — it is macOS-only
      # (osascript) and silently no-ops on the ubuntu runner. CI failures
      # surface through GitHub's own workflow-failure notifications; make
      # sure those are enabled for this repo. The job summary below is the
      # in-run breadcrumb.
      - name: Explain the failure in the job summary
        if: failure()
        run: |
          {
            echo "## Uplift daily FAILED — $(date -u +%Y-%m-%d)"
            echo
            echo "No edition was published. Download the **qa-reports** artifact on this run for the Tier 2 verdicts."
            echo
            echo "If a card genuinely failed visual review, fix the photo and re-run."
            echo "If the reviewers malfunctioned, re-run with **force_publish** checked."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the edition actually reached origin/main
        run: |
          git fetch origin main
          LOCAL="$(git rev-parse HEAD)"
          REMOTE="$(git rev-parse origin/main)"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "::error::Local HEAD ($LOCAL) never reached origin/main ($REMOTE) — today's commits were made locally but the push did not land."
            exit 1
          fi
          echo "confirmed: origin/main is at $REMOTE, matches this run's HEAD"
