<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
  overflow: hidden;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }

/* Mobile — prevent content overflowing into top chrome */
@media (max-width: 600px) {
  .card-inner {
    padding: 64px 20px 80px;
  }
  .headline {
    font-size: clamp(22px, 5vw, 32px);
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    overflow: hidden;
    font-size: 14px;
  }
  .cover-wordmark {
    font-size: clamp(40px, 12vw, 72px);
  }
  .bottom {
    padding: 14px 18px 20px;
  }
}
@media (max-height: 700px) {
  .card-inner {
    padding-top: 56px;
    padding-bottom: 72px;
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
  }
}
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 470 · Sat, June 13, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Saturday, June 13, 2026",
  edition: 470,
  stories: [
    {
      cat: "Global Progress",
      place: "French Polynesia",
      head: "French Polynesia has designated 520,000 square kilometres of ocean around the Austral and Marquesas Islands as the world's largest national marine protected area under the strictest conservation standard.",
      dek:  "President Moetai Brotherson announced the IUCN Category 1 designation — the highest formal conservation status, prohibiting mining, trawling, and all industrial fishing — over a zone roughly the size of France surrounding two of the archipelago's most remote island groups. The Te Moana Collective of eight conservation organisations committed US$15 million in seed funding for a perpetual conservation trust, while traditional pole-and-line fishing by vessels under 12 metres continues in defined artisanal zones around each island group. Combined with an earlier protection of 350,000 square miles around the Gambier and Society islands, 30 percent of French Polynesia's total waters are now formally protected — directly advancing the global '30 by 30' target of conserving a third of the world's ocean by 2030.",
      src:  "Conservation International",
      url:  "https://www.conservation.org/news/the-world-just-gained-a-marine-protected-area-the-size-of-france",
      img:  "https://images.unsplash.com/photo-k4XDVl-JCpQ?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Nature",
      place: "Iberian Peninsula, Spain and Portugal",
      head: "The Iberian lynx has reached 2,663 individuals — a 95 percent increase in four years and the highest count ever recorded — marking the first measurable step toward the population target for formal recovery.",
      dek:  "Portugal's Ministry of Environment announced on World Environment Day that the species now roams 26 distinct territories in Spain and Portugal, up from fewer than 100 animals in 2002 and 1,365 in 2021, with 542 breeding females and 952 cubs born in 2025 alone. The recovery follows decades of captive breeding at Jerez de la Frontera and four Portuguese reintroduction sites, combined with habitat corridor work under the LIFE LynxConnect programme now mapping ecological links between isolated populations in Doñana, Sierra Morena, and the Guadiana Valley. The programme aims for 4,500 to 6,000 animals before requesting a formal downgrade from endangered to vulnerable status on the IUCN Red List.",
      src:  "The Portugal News",
      url:  "https://www.theportugalnews.com/news/2026-06-08/iberian-lynx-population-grew-by-95/1036280",
      img:  "https://images.unsplash.com/photo-6njkAeHHMOE?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Everyday Joy",
      place: "Spello, Umbria, Italy",
      head: "For its 123rd year, some 2,000 residents of Spello spent the night of June 6 carpeting nearly two kilometres of medieval cobblestones with 1.5 million flower petals.",
      dek:  "Each year on the Saturday before Corpus Domini, roughly 70 teams of infioratori spend the night cutting and arranging flowers from 65 species into intricate panels across the Via Consolare — without glue or paint — covering the route from the Roman Porta Consolare to the town's panoramic overlook in works ranging from 25 to 70 square metres. By 8 a.m. the following morning the bishop led the Corpus Domini procession directly over the completed carpet before the petals could fade, sealing a tradition documented in Spello's parish records since at least 1581. Between 40,000 and 50,000 visitors attended, drawn to a hilltop village of 8,000 people where this single night of collective labour produces an entire gallery that exists for only a few hours.",
      src:  "SiViaggia",
      url:  "https://siviaggia.it/notizie/infiorate-spello-2026-umbria/590519/",
      img:  "https://images.unsplash.com/photo-v-3NQ3pmWkY?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "Stanford, California, USA",
      head: "Stanford researchers restored measurable cartilage in aged mice by blocking a single enzyme that doubles in joints as the body ages, with matching results in human tissue samples.",
      dek:  "A team led by Helen Blau and Nidhi Bhutani found that blocking 15-PGDH — a prostaglandin-degrading enzyme that roughly doubles in knee cartilage during ageing — caused the proportion of active chondrocytes in old mice to rise from 22 to 42 percent, restoring measurable cartilage thickness and significantly reducing post-injury arthritis. Human cartilage samples taken during knee-replacement surgeries showed the same regenerative response when exposed to the inhibitor in culture, confirming the mechanism translates across species. An oral form of the compound has already cleared a Phase 1 safety trial for another indication, giving the team a regulatory path to human knee-cartilage trials; osteoarthritis affects roughly 500 million people worldwide.",
      src:  "ScienceDaily / Science",
      url:  "https://www.sciencedaily.com/releases/2026/06/260612021604.htm",
      img:  "https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Small Wonders",
      place: "Mairehau, Christchurch, New Zealand",
      head: "A one-in-a-million chimera apple — split precisely half red, half golden-yellow, divided by a near-perfect straight line from stem to core — has become the quiet celebrity of a Christchurch corner shop.",
      dek:  "A Red Braeburn delivery to Sunshine Corner Market in Mairehau arrived with a single apple divided into two equal halves — one the variety's usual deep red, the other pale golden-yellow — with no bleeding between the colours along the dividing line running from stem to core; owner Heather, who has worked in produce for years, had never seen one before. After the first customers saw it and went home to bring disbelieving spouses and neighbours, she kept the apple refrigerated on display to extend its life. A chimera like this forms when two genetically distinct fertilised cells fuse very early in the development of a fruit bud — a chance event estimated to occur fewer than once per million apples.",
      src:  "New Zealand Herald",
      url:  "https://www.nzherald.co.nz/nz/unusual-split-colour-chimera-apple-amazes-shoppers-at-christchurch-fruit-shop/CM6YI22KXRDARHPG5BQEV3IEPQ/",
      img:  "https://images.unsplash.com/photo-O99GEXDopTk?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Eling, Hampshire, England",
      head: "Two neighbours in Eling founded a volunteer collective that cleared a fly-tipped lane and replanted it with fruit trees, wildflowers, and insect hotels for the whole street.",
      dek:  "Izzy and Robyn founded Common Earth Collective after watching Eling Lane — a walking route for children and dog walkers — fill with dumped furniture, broken glass, and fly-tipped waste; local businesses donated tools and materials, while children from Eling Infant School painted bug hotels for the new habitat strip. Over several working weekends, the 100-metre stretch became a corridor of raised beds, fruiting shrubs, a wildflower margin, and insect habitats where only rubble had been. The collective is now in talks with three neighbouring streets whose residents want to follow the same approach.",
      src:  "Good News Post",
      url:  "https://www.goodnewspost.co.uk/volunteers-transform-fly-tipped-eling-lane-into-community-green-space/",
      img:  "https://images.unsplash.com/photo-HkEHZZA5jwU?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
