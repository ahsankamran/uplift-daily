<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 463 · Sat, June 6, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Saturday, June 6, 2026",
  edition: 463,
  stories: [
    {
      cat: "Small Wonders",
      place: "Buru Island, Indonesia",
      head: "A bird species recorded just once in over a century was found alive on a remote Indonesian volcano — the blue-fronted lorikeet, rediscovered by an expedition that had to climb to 8,900 feet to find it.",
      dek:  "A blue-fronted lorikeet — listed as a 'lost species' since the early twentieth century and not reliably documented in over a hundred years — was photographed and recorded on Mount Kapalatmada on Buru Island, Indonesia, in April 2026. An expedition by the American Bird Conservancy, Birdtour Asia, and Yayasan Planet Indonesia trekked through unexplored montane cloud forest to 8,900 feet, found at least nine individuals darting between flowering trees, and captured the species' calls on tape for the first time on record. BirdLife International published the findings on June 3, 2026, confirming the lorikeet's survival in the high-altitude isolation that had kept it hidden from science for more than a century.",
      src:  "BirdLife International / American Bird Conservancy",
      url:  "https://www.birdlife.org/news/2026/06/03/blue-fronted-lorikeet-rediscovered-buru-island/",
      img:  "https://images.unsplash.com/photo-1552728089-57bdde30beb3?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Nature",
      place: "Otago coast, New Zealand",
      head: "New Zealand gazetted five new marine reserves along the Otago coast — adding 308 square kilometres of protected ocean and increasing mainland coverage by nearly half — to be co-managed with Kāi Tahu rangers starting July 1.",
      dek:  "The five reserves, gazetted on June 2, 2026, protect giant kelp forests, rocky reefs, deep offshore canyons, yellow-eyed penguins, and New Zealand sea lions along a stretch of the South Island coast without full protection for over a decade. The network has been renamed Te Au Roa o Te Rakihouia in honour of Kāi Tahu ancestral voyagers who navigated these waters; under a first-of-its-kind arrangement for New Zealand marine reserves, the Department of Conservation and Kāi Tahu rangers will manage them jointly from day to day. At 308 square kilometres, the reserves increase mainland New Zealand's total protected marine area by nearly 50 percent in a single decision, with the reserves entering legal force on 1 July 2026.",
      src:  "New Zealand Department of Conservation / Scoop",
      url:  "https://www.doc.govt.nz/news/media-releases/2026-media-releases/new-name-for-otagos-marine-reserve-network/",
      img:  "https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "Boston, Massachusetts",
      head: "A study of 27,000 people published in Nature finds that the thymus — long assumed to go quiet in adulthood — predicts mortality risk with striking precision, cutting the risk of death by half in those with the healthiest readings.",
      dek:  "Researchers at Mass General Brigham used deep-learning AI to analyse chest CT scans from two large prospective cohorts — the National Lung Screening Trial and the Framingham Heart Study — and found that adults with a denser, more active thymus had roughly 50 percent lower risk of death from all causes, 63 percent lower risk of cardiovascular death, and 36 percent lower risk of lung cancer. In a separate analysis of 1,200 cancer patients on immunotherapy, the same healthier-thymus signal predicted 44 percent lower odds of dying. Published June 1, 2026 in Nature, the findings suggest the thymus may be a measurable target for longevity-focused therapies, with clinical trials now in planning.",
      src:  "Mass General Brigham / Nature",
      url:  "https://www.sciencedaily.com/releases/2026/06/260601025352.htm",
      img:  "https://images.unsplash.com/photo-1507413245164-6160d8298b31?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Prince George, British Columbia, Canada",
      head: "On a busy British Columbia highway, a dozen strangers stopped their vehicles and carried a stranded moose calf back over a concrete divider to its waiting mother — then drove off without exchanging names.",
      dek:  "On May 28, a baby moose unable to climb a concrete highway divider on Highway 16 in Prince George brought traffic in both directions to a standstill until driver Duane Hogberg stepped out, scooped the calf into his arms, and walked it over the barrier to its mother. Hogberg described the animal as 'super soft, like kitten fur'; others blocked lanes until the pair were safely reunited. No one exchanged names, and traffic resumed within minutes.",
      src:  "CBC News",
      url:  "https://www.cbc.ca/news/canada/british-columbia/moose-calf-prince-george-highway-rescue-1.7234891",
      img:  "https://images.unsplash.com/photo-1516934434832-3d0490c4db99?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Everyday Joy",
      place: "Nassau Harbour, The Bahamas",
      head: "Six shipwrecks in Nassau Harbour have been confirmed as the first physical remains of the Golden Age of Piracy — the decade when Blackbeard, Calico Jack, and Anne Bonny based themselves on New Providence Island.",
      dek:  "Marine archaeologist Dr Sean Kingsley and Bahamian archaeologist Dr Michael Pateman recovered iron cannons, lead musket balls, a sword-grinding stone, and charred hull timbers from sites in and around Nassau Harbour, alongside a 3D reconstruction of the pirate settlement as it stood around 1715. The finds, published in Wreckwatch Magazine on June 4, 2026, are the first physical evidence of any of the roughly 40 ships historically recorded as sunk or burned near Nassau during the piracy era. Three centuries of shipwreck hunting, resolved in a place most researchers assumed had already been thoroughly searched.",
      src:  "LiveScience / Wreckwatch Magazine",
      url:  "https://www.livescience.com/archaeology/first-shipwrecks-linked-to-real-pirates-of-the-caribbean-found-in-bahamas",
      img:  "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "Papua New Guinea",
      head: "Papua New Guinea has cut its malaria death rate by 92 percent since 2000 — from 13 deaths per 100,000 to one — using diagnostic testing, artemisinin therapies, and bed nets, and without a vaccine.",
      dek:  "Annual malaria deaths in Papua New Guinea fell from roughly 700 in 2000 to 148 in 2025; Morobe province, the country's most populous, recorded just 66 malaria deaths last year. The reduction relied on no new technology — only expanded deployment of diagnostics, artemisinin-based combination therapies, and insecticide-treated bed nets across some of the world's most difficult terrain. Because Papua New Guinea accounts for approximately 90 percent of all malaria cases in the Western Pacific, a reduction of this magnitude has significance across the entire Pacific region.",
      src:  "Good News Network / The National (PNG)",
      url:  "https://www.goodnewsnetwork.org/no-vaccine-no-problem-papua-new-guinea-malaria-deaths-fall-by-92/",
      img:  "https://images.unsplash.com/photo-1576091160550-2173dba999ef?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
