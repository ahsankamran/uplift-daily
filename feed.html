<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
  overflow: hidden;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }

/* Mobile — prevent content overflowing into top chrome */
@media (max-width: 600px) {
  .card-inner {
    padding: 64px 20px 80px;
  }
  .headline {
    font-size: clamp(22px, 5vw, 32px);
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    overflow: hidden;
    font-size: 14px;
  }
  .cover-wordmark {
    font-size: clamp(40px, 12vw, 72px);
  }
  .bottom {
    padding: 14px 18px 20px;
  }
}
@media (max-height: 700px) {
  .card-inner {
    padding-top: 56px;
    padding-bottom: 72px;
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
  }
}
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 468 · Thu, June 11, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Thursday, June 11, 2026",
  edition: 468,
  stories: [
    {
      cat: "Everyday Joy",
      place: "Kaskelen, Almaty, Kazakhstan",
      head: "The Qazaqstan International Balloon Festival returns to the Almaty foothills after a two-year break, with 29 hot-air balloons and pilots from 12 countries soaring above the Trans-Ili Alatau mountain corridor.",
      dek:  "The Qazaqstan International Balloon Festival reopened at Kaskelen, in the Almaty foothills of Kazakhstan, from June 6–8, 2026 — the first edition since 2023 after the 2024 event was cancelled due to severe flooding in the region — drawing pilots and aircraft from Germany, Mongolia, Kyrgyzstan, and nine other countries, with one balloon shaped like a giant owl. More than 700 volunteers supported the two-day event; the fleet of 29 balloons launched each morning into weather windows that framed them against the snow-capped Tian Shan behind the city. Organisers are using the revival to anchor an adventure-tourism corridor south of Almaty; the 2023 edition drew more than 60,000 visitors, and attendance is expected to return to that scale.",
      src:  "Kazinform",
      url:  "https://qazinform.com/news/colorful-hot-air-balloons-soar-above-kazakhstans-kaskelen-6f91a8",
      img:  "https://images.unsplash.com/photo-1570498839593-e565b39455fc?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Nature",
      place: "Buru Island, Maluku, Indonesia",
      head: "After nearly a century of near-disappearance, the blue-fronted lorikeet has been photographed alive on Buru Island — nine individuals confirmed in a 14-day expedition that reached a summit no scientist had previously climbed.",
      dek:  "A 14-day expedition led by ornithologist John Mittermeier of the American Bird Conservancy climbed to the 8,850-foot summit of Mount Kapalatmada on Buru Island, Maluku — a route no scientist had previously taken — and found at least nine blue-fronted lorikeets, a lime-green parrot with an orange bill recorded only twice since its scientific description in the 1920s and feared functionally extinct. The team captured the first-ever audio recordings of the bird's calls and confirmed it inhabits high-elevation montane forest well above the logging pressure already affecting the island's lower slopes. Conservation partners Yayasan Planet Indonesia and Kanal Buru are now pressing for formal habitat protection before the remote plateau is opened to extractive industries.",
      src:  "Smithsonian Magazine",
      url:  "https://www.smithsonianmag.com/smart-news/this-colorful-parakeet-had-been-seen-only-once-over-the-past-century-birders-just-rediscovered-it-in-an-unexplored-indonesian-forest-180988907/",
      img:  "https://images.unsplash.com/photo-1574158622682-e40e69881006?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "Global",
      head: "Once-weekly survodutide cleared fatty liver disease entirely in 61 percent of patients in the SYNCHRONIZE-MASLD Phase 3 trial — the strongest result yet for a condition affecting 38 percent of adults worldwide.",
      dek:  "In the 216-person SYNCHRONIZE-MASLD trial, 48 weeks of once-weekly survodutide injections reduced liver fat below the clinical threshold of 5% in 61% of patients with metabolic-dysfunction-associated steatotic liver disease; 84.2% met the co-primary endpoint of at least 30% relative liver-fat reduction, and average body weight fell by up to 16.6%. Developed by Boehringer Ingelheim and Zealand Pharma, survodutide is a dual GLP-1 and glucagon receptor agonist — a newer mechanism than single-target drugs — and represents the first treatment to show results of this magnitude in MASLD, a disease that can progress silently to cirrhosis and currently has no broadly approved drug. Results were published in Nature Medicine on June 8 and presented at the American Diabetes Association's 2026 Scientific Sessions; the companies are advancing toward regulatory submission.",
      src:  "Nature Medicine",
      url:  "https://www.nature.com/articles/s41591-026-04479-3",
      img:  "https://images.unsplash.com/photo-1559757148-5c350d0d3c56?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Small Wonders",
      place: "Firth of Forth, Scotland",
      head: "Bass Rock — home to one of the world's largest northern gannet colonies and called one of the '12 wildlife wonders of the world' by Sir David Attenborough — has passed into conservation ownership for the first time in 320 years.",
      dek:  "The Dalrymple family, whose ownership of Bass Rock and the neighbouring Craigleith island in Scotland's Firth of Forth had been unbroken for over 320 years, sold both islands to RSPB Scotland for approximately £680,000 — backed by £586,000 from the National Heritage Memorial Fund. Bass Rock hosts around 100,000 northern gannets during breeding season, one of the densest seabird colonies in the world. Sir Hew Dalrymple said he acted because 'an organisation like the RSPB would be better equipped to protect the islands and their wildlife than a private individual.'",
      src:  "STV News",
      url:  "https://news.stv.tv/east-central/rspb-buys-scottish-islands-to-safeguard-awe-inspiring-seabird-sanctuaries",
      img:  "https://images.unsplash.com/photo-1548550023-2bdb3c5beed7?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Amritsar, Punjab, India",
      head: "A clothing shopkeeper near the Golden Temple in Amritsar served chai, cooked a full Punjabi meal, walked a foreign visitor through the neighbourhood, and placed a traditional scarf around his neck — all after the visitor arrived with no money.",
      dek:  "When British traveller Harry Jaggard walked into Yugam Lamba's shop near the Golden Temple carrying no money, Lamba guided him upstairs to the rooftop terrace, served chai and biscuits and chole kulche, spent the afternoon walking him through the neighbourhood, and tied a dupatta around his neck at the door — asking for nothing. The video, posted on Lamba's Instagram account, drew hundreds of thousands of views and restarted conversations across Indian social media about the country's long tradition of atithi devo bhava, the principle that the guest is god. The Tribune India reported the story on June 5, 2026.",
      src:  "The Tribune India",
      url:  "https://www.tribuneindia.com/news/punjab/no-money-no-problem-bro-youre-in-india-amritsar-shopkeepers-kindness-to-british-tourist-wins-hearts-online/",
      img:  "https://images.unsplash.com/photo-1587474260584-136574528ed5?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "Turks and Caicos Islands",
      head: "The World Health Organization certified the Turks and Caicos Islands for eliminating mother-to-child transmission of both HIV and hepatitis B — the first territory in the Americas to achieve the hepatitis B milestone.",
      dek:  "On June 3, 2026, WHO and PAHO certified the Turks and Caicos Islands for validated elimination of mother-to-child transmission of HIV and hepatitis B simultaneously — the first territory in the Americas to meet the stricter hepatitis B standard, which requires birth-dose vaccination coverage above 90% within 24 hours of delivery. The territory now screens more than 95% of pregnant women at antenatal care and has pushed paediatric HIV transmission below 2 per 1,000 live births; the programme was partly funded through the India–UN Development Partnership Fund. PAHO Director Dr. Jarbas Barbosa credited 'years of dedicated work to ensure that every pregnant woman and child have access to timely, quality health services.'",
      src:  "PAHO / WHO",
      url:  "https://www.paho.org/en/news/3-6-2026-who-certifies-turks-and-caicos-eliminating-mother-child-transmission-hiv-and",
      img:  "https://images.unsplash.com/photo-1584820927498-cfe5211fd8bf?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
