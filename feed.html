<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
  overflow: hidden;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }

/* Mobile — prevent content overflowing into top chrome */
@media (max-width: 600px) {
  .card-inner {
    padding: 64px 20px 80px;
  }
  .headline {
    font-size: clamp(22px, 5vw, 32px);
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    overflow: hidden;
    font-size: 14px;
  }
  .cover-wordmark {
    font-size: clamp(40px, 12vw, 72px);
  }
  .bottom {
    padding: 14px 18px 20px;
  }
}
@media (max-height: 700px) {
  .card-inner {
    padding-top: 56px;
    padding-bottom: 72px;
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
  }
}
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 478 · Mon, June 22, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Thursday, June 25, 2026",
  edition: 480,
  stories: [
    {
      cat: "Small Wonders",
      place: "Neotropical region",
      head: "A Neotropical butterfly lives nearly three times longer than its closest relatives and shows almost no physiological decline as it ages — a discovery that may point toward the molecular roots of healthy longevity.",
      dek:  "Researchers at the University of Bristol studied Heliconius butterflies and their relatives, finding that one species, Heliconius hewitsoni, lives up to 348 days while the closely related Dione juno survives only 14 days — a 25-fold difference in maximum lifespan. In at least one Heliconius species, grip strength did not decline in older individuals, suggesting the insects have evolved to suppress physiological deterioration. The study, published in Nature Communications, found pollen-feeding contributes to longevity, but removing pollen did not eliminate the advantage, suggesting multiple mechanisms are at work.",
      src:  "ScienceDaily / University of Bristol",
      url:  "https://www.sciencedaily.com/releases/2026/06/260622014302.htm",
      img:  "https://images.unsplash.com/photo-lQPlQNIK-qk?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "Leiden, Netherlands",
      head: "A study of 212 long-lived families from Leiden has identified twelve rare genetic variants linked to healthy aging — including one mutation that appears to dial down inflammation while leaving immune function intact.",
      dek:  "Researchers from Leiden University Medical Center, presenting at the European Society of Human Genetics conference in Gothenburg, found that middle-aged people with long-lived parents developed cardiometabolic diseases an average of thirteen years later than their partners whose parents had typical lifespans. Scanning the genomes of 212 family groups from the Leiden Longevity Study, the team narrowed from 20,000 candidate genes to just 350, then to twelve rare protein-altering variants. One variant in the CGAS gene appeared in two separate families and will now be tested in killifish at the Max Planck Institute for the Biology of Ageing in Cologne.",
      src:  "ScienceDaily / European Society of Human Genetics",
      url:  "https://www.sciencedaily.com/releases/2026/06/260621060301.htm",
      img:  "https://images.unsplash.com/photo-PYJsZHFGUuA?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "Bogotá, Colombia",
      head: "Colombia's Congress has passed Latin America's first law specifically outlawing female genital mutilation — a milestone reached after two years of advocacy led largely by indigenous Emberá women.",
      dek:  "The Senate approved Bill 440 unanimously on 10 June 2026, creating a framework for the prevention, response, and eradication of FGM in Colombia, where the practice has persisted in Emberá communities in Chocó and Risaralda; between January 2024 and March 2026, ninety-eight cases were recorded, seventy percent of them in children under one year old. The bill's authors embedded an 'intercultural approach' — building the law through dialogue with Emberá communities — after years of advocacy by indigenous women and survivors. With President Petro's signature expected, Colombia becomes the first country in Latin America and the Caribbean to establish dedicated legislation on the issue.",
      src:  "Equality Now",
      url:  "https://equalitynow.org/news/news-and-insights/a-victory-for-the-movement-colombia-adopts-latin-americas-first-law-against-fgm-c/",
      img:  "https://images.unsplash.com/photo-niF21NBzPjI?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Edinburgh / Boston",
      head: "Thirty thousand Scottish football supporters turned Boston into a brief neighbourhood of its own, leaving the city with a new friendship, a viral dance-off, and a formal twin-city proposal.",
      dek:  "After their team's 2–2 draw with the Netherlands, 30,000 Scottish fans spread through Boston's neighbourhoods, playing bagpipes before dawn outside someone's window (who then grilled them sausages), improvising with street drummers, and teaching police officers attempted Highland dances. The fans' warmth circulated widely in videos; Nina Shimaguchi of the Japan American Society said it reflected a recognition that thirty thousand strangers had come to be neighbours for a week, not merely visitors. Mayor Michelle Wu announced plans for a formal partnership between Boston and Edinburgh, and the Boston Globe printed a full-page farewell tribute the morning they left.",
      src:  "Good News Network",
      url:  "https://www.goodnewsnetwork.org/30000-scots-descend-on-boston-for-world-cup/",
      img:  "https://images.unsplash.com/photo-4mY4PA450SI?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Nature",
      place: "West Java, Indonesia",
      head: "With as few as fifty Javan green magpies left in the wild and twelve previously inhabited survey sites found empty, forty-eight experts have agreed on the first ten-year plan to save Indonesia's most endangered songbird.",
      dek:  "Endemic to the upland forests of West Java, the emerald-feathered Cissa thalassina has been decimated by trapping for the cage-bird trade; surveys between 2018 and 2021 found no birds at twelve sites where the species had historically lived. The action plan, agreed by groups including Chester Zoo, Copenhagen Zoo, and the Cikananga Wildlife Center, calls for habitat protection, community engagement against trapping, and eventual translocation from the more than 130 captive-bred individuals held as an insurance population. Conservationists built law-enforcement measures alongside public outreach, acknowledging that increased attention could drive traffickers to search harder for wild birds.",
      src:  "Mongabay",
      url:  "https://news.mongabay.com/2026/06/on-the-brink-of-extinction-the-javan-green-magpie-gets-a-conservation-lifeline/",
      img:  "https://images.unsplash.com/photo-MLYr0ns5qMg?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Everyday Joy",
      place: "Minneapolis, USA",
      head: "For one dollar in quarters, a vending machine in a Minneapolis bookshop dispenses a mystery envelope containing an original artwork by a local artist — and nearly three thousand pieces have sold.",
      dek:  "Artist Lilyan Lauzon installed the machine at Inkwell Booksellers, stocking it with rotating works by emerging artists who each send new pieces monthly and receive the full dollar from every sale. Of the nearly 3,000 pieces sold, several buyers have sought out the featured artists at fairs to commission larger work, turning a one-dollar introduction into a real career connection. Lauzon plans to install additional machines at other bookshops, keeping the price — and the mystery — at a dollar.",
      src:  "Good News Network",
      url:  "https://www.goodnewsnetwork.org/minnesota-artists-mini-art-vending-machine-has-sold-nearly-3000-pieces-of-one-dollar-art/",
      img:  "https://images.unsplash.com/photo-RmlDzoC7avY?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
