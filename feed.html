<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 459 · Tue, June 2, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Tuesday, June 2, 2026",
  edition: 459,
  stories: [
    {
      cat: "Nature",
      place: "Chishui River, Guizhou, China",
      head: "China's Yangtze sturgeon — declared extinct in the wild — has reproduced naturally in the Chishui River for the first time in 25 years, after 342 small hydropower stations were dismantled across three provinces.",
      dek:  "Researchers at the Chinese Academy of Sciences recorded more than 200,000 fertilized eggs on the Chishui riverbed in spring and confirmed juvenile sturgeon hatchlings — the first natural reproduction of the species since 2000, when dam construction severed its upstream spawning routes along the tributaries of the upper Yangtze. The recovery followed a programme in which Guizhou, Yunnan, and Sichuan provinces dismantled 342 small hydropower stations between 2020 and 2024, reconnecting more than twenty tributaries and restoring 492 kilometres of migratory corridor that the sturgeon — a prehistoric fish that has swum Chinese rivers for 140 million years — had been unable to access for decades. A peer-reviewed analysis published in the journal Water in 2026 documented rising fish biodiversity across the Chishui each year since dismantling began, with the sturgeon's natural reproduction providing the strongest evidence yet that removing dams can reverse what had seemed like an irreversible extinction in the wild.",
      src:  "Chinese Academy of Sciences / Xinhua / Water (MDPI)",
      url:  "https://english.news.cn/20250616/ee88655f199e4359bae408c6b30349ae/c.html",
      img:  "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "Sub-Saharan Africa",
      head: "Africa added a record 11.3 gigawatts of renewable energy in 2025 — triple the previous year — and for the first time solar and wind projects outnumbered all new fossil-fuel announcements across the continent.",
      dek:  "Analysis published by the Associated Press on 27 May shows that Africa's new renewable capacity in 2025 reached 11.3 gigawatts, with 173 of the continent's 322 announced energy projects classified as solar or wind — outnumbering coal, gas, and large-hydro commitments for the first time on record. South Africa, Egypt, and Ethiopia drove most of the growth, while the International Renewable Energy Agency notes that utility-scale solar in parts of Africa now generates electricity below the operating cost of existing coal plants, making the switch economically straightforward without policy pressure. The African Development Bank, whose Mission 300 electricity-access tracker launched on 31 May, reports its active portfolio has already connected 5.2 million people to power and targets 300 million more by 2030.",
      src:  "International Renewable Energy Agency / Associated Press / African Development Bank",
      url:  "https://www.nationalobserver.com/2026/05/27/news/renewable-energy-overtakes-traditional-power-projects-across-africa-industry",
      img:  "https://images.unsplash.com/photo-1509391366360-2e959784a276?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Everyday Joy",
      place: "Campina Grande, Paraíba, Brazil",
      head: "The world's biggest São João opens this week in Campina Grande, Brazil — 33 nights of forró, quadrilha dancing, and bonfire parades expected to draw three million visitors to the country's northeast.",
      dek:  "Brazil's June festival calendar peaks in Campina Grande, Paraíba, where the self-proclaimed Maior São João do Mundo fills the 60,000-capacity Parque do Povo for 33 consecutive nights with forró accordion bands, quadrilha junina troupes in hand-sewn country costumes, and bonfire platforms eight metres tall. The tradition blends the Catholic feast day of Saint John the Baptist with centuries of northeastern Brazilian rural custom: quadrilha groups spend months rehearsing mock wedding pageants complete with painted freckles and straw hats, then compete each night before judges who score for storytelling and costume. The 43rd edition — running 3 June to 5 July — has been registered by Brazil as part of its Intangible Cultural Heritage, joining a parallel celebration in Caruaru 300 kilometres away in what Brazilians call the month of the arraiá.",
      src:  "Prefeitura de Campina Grande / Brazil Ministry of Tourism",
      url:  "https://campinagrande.pb.gov.br/o-maior-sao-joao-do-mundo-prefeitura-de-campina-grande-e-arte-producoes-divulgam-programacao-oficial-da-edicao-2026/",
      img:  "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Tampines, Singapore",
      head: "A Singapore photojournalist cooked for nearly 20 hours and served free soup to 50 strangers at his housing-block void deck — and plans to do it every month.",
      dek:  "Ngoh Shian Bang, a photojournalist at Lianhe Zaobao, paid S$89 to rent a community space at his housing block in Tampines, simmered a clear chicken-and-vegetable broth alongside a spiced pumpkin-and-red-lentil coconut-milk soup through a 20-hour preparation, and opened his table on 30 May to any neighbour or stranger who wished to eat. Over 40 people came; conversations started between residents who had never spoken despite living in the same block for years; his Reddit post drew more than 6,600 upvotes. He has already applied for the same community booking in July and calls the project his Kampong Soup Kitchen — kampong being the Malay word for village.",
      src:  "Mothership.SG / Stomp.SG",
      url:  "https://mothership.sg/2026/06/singapore-man-free-sou-hdb-void-deck/",
      img:  "https://images.unsplash.com/photo-1569050467447-ce54b3bbc37d?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Small Wonders",
      place: "Chester Zoo, England",
      head: "Three endangered giant otter pups took their first swimming lessons at Chester Zoo on 28 May, guided into the water one by one by their parents.",
      dek:  "Giant otter pups Uca, Yali, and Yara — born 9 February to parents Bonita and Manu — completed their first swimming session when each parent took a pup by the scruff and lowered it into the water; within minutes all three were paddling independently. Giant otters are classified as endangered by the IUCN, with between 2,000 and 5,000 individuals remaining in South America's rivers, making every birth in the European coordinated breeding programme a meaningful contribution. Chester Zoo says the triplets will be reported to the European Association of Zoos and Aquaria as part of an international effort to maintain genetic diversity for eventual reintroduction programmes.",
      src:  "Chester Zoo / Talker News",
      url:  "https://talker.news/2026/05/29/baby-otter-triplets-go-swimming-for-first-time/",
      img:  "https://images.unsplash.com/photo-1564349683136-77e08dba1ef7?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "Shibaura Institute of Technology, Tokyo, Japan",
      head: "Japanese chemists synthesised vitamin K analogues three times more potent at generating new brain neurons — and confirmed the compounds cross the blood-brain barrier in mice.",
      dek:  "Researchers at Shibaura Institute of Technology in Tokyo fused vitamin K molecules with retinoic acid to create hybrid analogues; in laboratory models the compounds activated the mGluR1 receptor at three times the potency of natural vitamin K, steering neural stem cells to differentiate into neurons rather than the support cells they produce by default. When administered to mice, the compounds accumulated in neural tissue at higher concentrations than unmodified vitamin K, confirming they can cross the blood-brain barrier — a long-standing obstacle to using vitamin K as a brain therapy. The research team, led by Associate Professor Yoshihisa Hirota, says the analogues are a candidate platform for future Alzheimer's and Parkinson's treatments, though human trials have not yet begun.",
      src:  "Shibaura Institute of Technology / ACS Chemical Neuroscience / ScienceDaily",
      url:  "https://www.sciencedaily.com/releases/2026/05/260526233433.htm",
      img:  "https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
