<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 449 · Sat, May 23, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Sunday, May 24, 2026",
  edition: 450,
  stories: [
    {
      cat: "Nature",
      place: "Vercors Plateau, France",
      head: "The municipality of Die has placed its entire 432-hectare communal forest on the Vercors plateau under a 60-year nature-recovery easement — the first such commitment by any French town.",
      dek:  "In the Dauphiné Alps above the Drôme valley, the town of Die and Rewilding France signed an Obligation Réelle Environnementale — a legally binding easement that travels with the land for sixty years regardless of future administrations — committing all 432 hectares of the communal forest to nature-led management. Ninety of those hectares enter protection immediately: 80 pass into strict libre évolution, where felling and replanting cease entirely, and 10 are scattered as "senescence islands" where fallen timber stays as deadwood habitat. The municipality receives compensation for foregone timber revenue, and the agreement — acknowledged by Rewilding Europe as the first of its kind for a French communal woodland — has already drawn inquiries from fifteen other towns on the plateau.",
      src:  "Rewilding Europe / Rewilding France",
      url:  "https://rewildingeurope.com/news/ambitious-agreement-sets-precedent-for-natural-forest-management-in-france/",
      img:  "https://images.unsplash.com/photo-1448375240586-882707db888b?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "Worldwide",
      head: "Wind and solar generated more electricity worldwide than gas in April 2026 — the first month in modern energy history that renewables have surpassed fossil fuels globally.",
      dek:  "Analysing data from 80 countries, the energy think tank Ember found that combined wind and solar output reached 531 terawatt-hours in April 2026 — 22 percent of global electricity — while gas-fired plants supplied 477 TWh, or 20 percent, the first time the gap has been crossed in a single calendar month. Five years earlier, in April 2021, gas produced a virtually identical 476 TWh while wind and solar together managed only 245 TWh — less than half the 2026 output. Global wind and solar grew 13 percent year-on-year, with standout gains in the United Kingdom, Australia, Chile, the European Union, and China.",
      src:  "Ember / pv magazine International",
      url:  "https://www.pv-magazine.com/2026/05/22/solar-and-wind-generated-more-electricity-globally-than-gas-power-for-the-first-time-in-april/",
      img:  "https://images.unsplash.com/photo-1466611653911-95081537e5b7?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "Barcelona, Spain",
      head: "A device that drains excess fluid through the chest's lymphatic vessel rather than the kidneys cleared 6.8 kilograms from hospitalised heart failure patients while leaving kidney function intact, a trial finds.",
      dek:  "WhiteSwell's eLym System — a catheter inserted into the thoracic duct, the body's largest lymphatic vessel — was evaluated in 40 patients admitted with acute decompensated heart failure, with results published simultaneously in the European Journal of Heart Failure and presented at the Heart Failure 2026 Congress in Barcelona on 10 May. Patients lost a mean 6.8 kilograms of fluid by discharge; serum creatinine remained stable throughout, a notable finding because standard diuretic therapy commonly damages the kidneys. A larger randomised trial, LYMPH-HF, is now planned across the United States, Canada, Europe, and Israel.",
      src:  "European Journal of Heart Failure / WhiteSwell",
      url:  "https://www.globenewswire.com/news-release/2026/05/10/3291471/0/en/whiteswell-announces-primary-clinical-trial-results-simultaneously-at-heart-failure-2026-congress-and-in-european-journal-of-heart-failure-related-to-the-delta-hf-study-in-acute-de.html",
      img:  "https://images.unsplash.com/photo-1538108149393-fbbd81895907?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Sambalpur, Odisha, India",
      head: "Women from 2,100 self-help groups collect, sort, and sell more than 170 tonnes of Sambalpur's household waste each day, turning rubbish into a Rs 20-lakh monthly income for the city.",
      dek:  "In Sambalpur, Odisha, door-to-door collectors called Swachha Sathis — drawn from Mission Shakti women's self-help groups — visit every household on a daily route, separating wet waste for composting from dry material for resale, across nine \"Wealth Centres\" operated by the municipal corporation. The programme has grown from earning Rs 1.5 lakh a month in 2023 to Rs 20 lakh — roughly $24,000 — in 2026, with proceeds channelled back into public sanitation. It is now being studied by neighbouring municipalities in Odisha as a model for women-led urban waste economies.",
      src:  "The Better India",
      url:  "https://thebetterindia.com/sustainability/sambalpur-odisha-wealth-centres-waste-management-mission-shakti-swachha-sathi-11851983",
      img:  "https://images.unsplash.com/photo-1532375810709-75b1da00537c?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Small Wonders",
      place: "Western Australia",
      head: "DNA extracted from droppings has revealed exactly which underground fungi the world's rarest marsupial depends on to eat — giving conservationists a practical map for finding safe habitat for the first time.",
      dek:  "Researchers at Edith Cowan University in Perth analysed faecal eDNA from Gilbert's potoroo — a rabbit-sized marsupial with fewer than 150 individuals surviving in a single patch of Western Australian heath — and used DNA metabarcoding to identify the precise network of underground mycorrhizal fungi the animal relies on for nutrition. The potoroo was thought extinct for most of the twentieth century and was rediscovered only in 1994; because its dietary fungi are invisible on the surface, selecting candidate habitats for new populations had been largely guesswork. The fungi map now points scientists toward specific forest types where translocations could establish insurance populations before the next bushfire threatens the last colony.",
      src:  "Edith Cowan University / ScienceDaily",
      url:  "https://www.sciencedaily.com/releases/2026/05/260519224319.htm",
      img:  "https://images.unsplash.com/photo-1574266771718-c785e3f10a3e?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Everyday Joy",
      place: "Great Britain",
      head: "Hand-crocheted wildlife scenes have appeared on red post boxes in seven British cities to mark David Attenborough's one hundredth birthday.",
      dek:  "Hobbycraft dispatched crocheted post-box toppers to London, Leicester, Cambridge, Edinburgh, Manchester, Bournemouth, and Glasgow — each city chosen for its connection to Attenborough's life — with each topper depicting a native animal: bees, squirrels, hedgehogs, and woodland scenes designed by Knitcraft expert Natalie Beard. The campaign runs through May and invites the public to submit their own nature-inspired pieces; at the month's end the original toppers will be donated or auctioned for environmental charities. Attenborough, who turned 100 on 8 May, is the only person to have presented natural history documentaries in black-and-white, colour, high definition, and 4K.",
      src:  "Hobbycraft / The NEN",
      url:  "https://nen.press/yarn-bombed-postboxes-pop-up-for-david-attenboroughs-100th-birthday/",
      img:  "https://images.unsplash.com/photo-1558618047-3c8c76da7fd7?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
