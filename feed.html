<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
  overflow: hidden;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }

/* Mobile — prevent content overflowing into top chrome */
@media (max-width: 600px) {
  .card-inner {
    padding: 64px 20px 80px;
  }
  .headline {
    font-size: clamp(22px, 5vw, 32px);
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    overflow: hidden;
    font-size: 14px;
  }
  .cover-wordmark {
    font-size: clamp(40px, 12vw, 72px);
  }
  .bottom {
    padding: 14px 18px 20px;
  }
}
@media (max-height: 700px) {
  .card-inner {
    padding-top: 56px;
    padding-bottom: 72px;
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
  }
}
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 501 · Fri, July 24, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Friday, July 24, 2026",
  edition: 501,
  stories: [
    {
      cat: "Nature",
      place: "Alta Floresta, Brazil",
      head: "Rope bridges strung through the Amazon canopy have logged 15,000 animal crossings without a single roadkill.",
      dek:  "Biologist Fernanda Abra's Projeto Reconecta strung eight rope bridges through the rainforest canopy in Alta Floresta, Mato Grosso, and over 15 months cameras recorded 15,000 animal crossings with zero roadkill below. A separate, older network of 32 bridges over the BR-174 highway, built with Brazil's federal transport agency and the Waimiri-Atroari Indigenous people, has logged roughly 1,250 primate crossings in five years, including passage for the critically endangered buffy-headed marmoset, of which only about 2,500 remain in the wild. Brazil's roads kill an estimated nine million mammals a year, and Alta Floresta now plans eight more bridges through its urban area by August.",
      src:  "Mongabay",
      url:  "https://news.mongabay.com/2026/07/zero-roadkill-as-amazon-canopy-bridges-secure-15000-crossings/",
      img:  "https://images.unsplash.com/photo-1650397419080-f50b3ba39a27?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Small Wonders",
      place: "Düsseldorf, Germany",
      head: "Scientists found the exact brain switch that tells a worker bee which job to do.",
      dek:  "Biologists at Heinrich Heine University Düsseldorf, working with colleagues in Cologne and Frankfurt, traced honeybees' age-based division of labor to specific neurons linked to the doublesex gene. When lead author Jana Seiler's team silenced those neurons, older worker bees reverted to nursing the queen, a task normally handled only by younger bees, showing the circuit alone was steering the switch. Professor Martin Beye said the discovery, published in the Proceedings of the National Academy of Sciences, opens a new way to study how a colony organizes itself without any single bee in charge.",
      src:  "Phys.org",
      url:  "https://phys.org/news/2026-07-bee-brains-reveal-colonies-central.html",
      img:  "https://images.unsplash.com/photo-1578684568599-59ce64da4356?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "Zambia",
      head: "Zambia launched the final round of a polio campaign aiming to reach 3.9 million children.",
      dek:  "Zambia's Ministry of Health, with the World Health Organization, UNICEF, Rotary International and the Global Polio Eradication Initiative, deployed 7,830 vaccination teams across six provinces from July 21 to 26 to reach 3.9 million children under five. The round follows poliovirus detected in environmental samples earlier this year, and it closes out a three-round campaign covering 71 districts and nearly 2,000 health facilities. Zambia used the campaign's launch to switch on a new 100-kilowatt solar array at its National Vaccine Store, cutting an estimated $48,000 a year from the cost of keeping vaccines cold.",
      src:  "Zambia Monitor",
      url:  "https://www.zambiamonitor.com/zambia-launches-final-polio-round-targets-3-9-million-children-under-five/",
      img:  "https://images.unsplash.com/photo-1632053002928-1919605ee6f7?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Everyday Joy",
      place: "Cambridge, Illinois",
      head: "A nine-year-old's bedroom fossil collection grew into his own natural history museum.",
      dek:  "Anderson Taylor opened the Cambridge Natural History Museum in a former fire station in Cambridge, Illinois, at nine years and 340 days old, earning a Guinness World Records title as the youngest male museum curator. The idea took hold after a family trip to Scotland's Staffin Dinosaur Museum, and Taylor has since raised $20,000 toward buying the building outright. He now gives weekend tours of his fossils and mineral specimens, working, he says, toward becoming a paleontologist.",
      src:  "Euronews",
      url:  "https://www.euronews.com/culture/2026/07/17/dinosaur-loving-nine-year-old-boy-recognised-by-guinness-world-records-as-youngest-museum-",
      img:  "https://images.unsplash.com/photo-1724778057066-3f64121eac13?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "Tokyo, Japan",
      head: "Four men paralyzed by spinal cord injuries regained measurable movement after a stem cell transplant.",
      dek:  "Surgeons at Keio University in Japan injected roughly two million lab-grown neural stem cells, derived from induced pluripotent stem cells and paired with temporary immunosuppression, directly into the injury site of four men with recent, complete cervical spinal cord injuries. Two of the four progressed from complete paralysis to partial motor function within four years of follow-up, with median motor scores improving 13 points beyond what a comparable patient registry would predict, and researchers reported no tumors or serious complications. The Phase 1 results, published in Nature Medicine, clear the way for a larger trial testing whether the recovery holds up at scale.",
      src:  "Inside Precision Medicine",
      url:  "https://www.insideprecisionmedicine.com/topics/translational-research/spinal-cord-injury-stem-cell-transplant-clears-phase-i-improves-motor-scores/",
      img:  "https://images.unsplash.com/photo-1614935151651-0bea6508db6b?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Paris, France",
      head: "A homeless shelter in Paris got its own outdoor gym, built for people usually left out of fitness culture.",
      dek:  "Finnish company Omnigym installed four pieces of outdoor exercise equipment at the Emmaüs Solidarité shelter on Boulevard Pereire, free for the roughly 200 people who live there to use. The project responds to a Eurobarometer finding that 45 percent of Europeans never exercise, and Omnigym chief executive Kirsti Laasio said the goal was making training accessible regardless of income or circumstance. Residents can now use the equipment any time, with no membership fees or class schedules to work around.",
      src:  "AthleTech News",
      url:  "https://athletechnews.com/omnigym-opens-outdoor-gym-in-paris-for-homeless-people/",
      img:  "https://images.unsplash.com/photo-1773469333571-494f1c01e411?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
