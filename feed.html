<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
  overflow: hidden;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }

/* Mobile — prevent content overflowing into top chrome */
@media (max-width: 600px) {
  .card-inner {
    padding: 64px 20px 80px;
  }
  .headline {
    font-size: clamp(22px, 5vw, 32px);
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    overflow: hidden;
    font-size: 14px;
  }
  .cover-wordmark {
    font-size: clamp(40px, 12vw, 72px);
  }
  .bottom {
    padding: 14px 18px 20px;
  }
}
@media (max-height: 700px) {
  .card-inner {
    padding-top: 56px;
    padding-bottom: 72px;
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
  }
}
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 571 · Tue, November 24, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Tuesday, November 24, 2026",
  edition: 571,
  stories: [
    {
      cat: "Everyday Joy",
      place: "Istanbul, Turkey",
      head: "Istanbul has cleared 420 metres of tunnel under Hagia Sophia.",
      dek:  "Crews working on the building's restoration have carried almost 3,000 tonnes of backfill out of the Vizier's Garden and the western garden, opening up nine tunnels and six underground rooms, seven of the tunnels now emptied to the floor. What they found is mostly plumbing: galleries, channels that once distributed water and carried rainwater away, and a 180-metre passage that may run towards the Roman road of Constantinople. Archaeologists are now dating architectural layers sitting about 1.5 metres below an old floor in a rock-cut burial chamber, and the culture ministry is working out which of the spaces visitors might one day be allowed to walk through.",
      src:  "Euronews",
      url:  "https://www.euronews.com/2026/11/21/hagia-sophias-hidden-tunnels-uncovered-as-420-metres-of-underground-network-cleaned",
      img:  "https://images.unsplash.com/photo-1683874350903-8151d987fef4?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Small Wonders",
      place: "Winston-Salem, North Carolina, USA",
      head: "Paper wasps have brain cells that answer only to other wasps' faces.",
      dek:  "Recording from the brains of northern paper wasps — insects 1.3cm long, with a brain about the size of a grain of rice — researchers found a cluster of neurons that responds to pictures of wasp faces and largely ignores everything else. Each cell in the group has its own slight preference, so between them they carry which wasp is which, which is how a wasp can watch two others square up and then treat the winner and the loser differently afterwards. Christopher Jernigan of Wake Forest University led the work with colleagues at Cornell and Rockefeller, published in Cell; he would like to know next whether wasps read expressions as well as identities.",
      src:  "Phys.org",
      url:  "https://phys.org/news/2026-11-specialized-brain-cells-wasps-wasp.html",
      img:  "https://images.unsplash.com/photo-1690934164885-314fc9eeaa5b?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Nature",
      place: "Dornoch Firth, Sutherland, Scotland",
      head: "Oysters have bred in the Dornoch Firth for the first time in more than a century.",
      dek:  "Heriot-Watt University scientists picked up baby oysters, or spat, during routine monitoring, and on a return visit found some had grown to the size of a 50p coin — evidence that the restored bed is reproducing on its own. National Museums Scotland and Amgueddfa Cymru checked the identification; the firth's native oysters were fished out in the late 1800s, and the Dornoch Environmental Enhancement Project began putting them back in 2017 with 300 animals from Loch Ryan. More than 140,000 juveniles have gone in since, and the project — Heriot-Watt with the Glenmorangie Company and the Marine Conservation Society — is aiming at roughly four million by 2031.",
      src:  "The Northern Times",
      url:  "https://www.northern-times.co.uk/news/historic-milestone-as-reintroduced-native-oysters-breed-in-t-450812/",
      img:  "https://images.unsplash.com/photo-1717251720395-f7ebb07f120d?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Penparcau, Ceredigion, Wales",
      head: "A Penparcau gardening group is building vegetable beds for a charity across town.",
      dek:  "Penparcau Community Forum, whose own gardens have taken Green Flag Community Awards in successive years, is putting vegetable and fruit beds, planters and a shed into the grounds of HAHAV's wellbeing centre in Aberystwyth. Volunteers will gather at the Penparcau hub on Wednesday mornings for breakfast and a briefing before heading over, and the two organisations intend to share helpers between the sites. Sam Hughes-Evans, who manages the forum, says the aim is to repeat at HAHAV what the group has already built in Penparcau, and both sides hope the shared rota turns up gardeners neither would have found alone.",
      src:  "Cambrian News",
      url:  "https://www.cambrian-news.co.uk/news/penparcau-aberystwyth-hahav-973896",
      img:  "https://images.unsplash.com/photo-1791318219716-2ce5458c8257?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "Fourteen sites in five countries",
      head: "A tuberculosis trial has narrowed ten new drug combinations down to two.",
      dek:  "PARADIGM4TB gave 401 adults with drug-susceptible lung tuberculosis one of ten new sixteen-week regimens, or the standard twenty-four-week course, at 14 sites across five countries, and measured how fast the bacteria cleared from their sputum. Two combinations came through: bedaquiline, pretomanid and moxifloxacin with ganfeborole, and bedaquiline, delamanid and moxifloxacin with BTZ-043; a third was set aside over liver toxicity. The next stage asks how far the four months can be cut and still hold, and whatever survives that will need a phase 3 trial before anyone is treated with it.",
      src:  "The New England Journal of Medicine",
      url:  "https://www.nejm.org/doi/full/10.1056/NEJMoa2611913",
      img:  "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "India",
      head: "India has given ten million girls their HPV shot in under nine months.",
      dek:  "The national campaign offers every 14-year-old girl a free single dose at a government health facility, and passed one crore doses in November against an annual target of about 1.2 crore — roughly 87% coverage since it began in February. Gujarat, Uttar Pradesh, Andhra Pradesh, Mizoram, Madhya Pradesh and Bihar have each reached their whole identified group; Uttar Pradesh alone accounts for more than 29 lakh girls, Bihar more than 13 lakh. Assam, Telangana, Karnataka and Uttarakhand are all above 90%, and the health ministry says the work now is the states still short of that.",
      src:  "News On AIR",
      url:  "https://newsonair.gov.in/india-crosses-historic-milestone-of-1-crore-hpv-vaccine-doses-administered-in-less-than-9-months/",
      img:  "https://images.unsplash.com/photo-1746017090180-ebb14a589639?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
