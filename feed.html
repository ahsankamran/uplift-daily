<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 456 · Sat, May 30, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Sunday, May 31, 2026",
  edition: 457,
  stories: [
    {
      cat: "Everyday Joy",
      place: "Cheung Chau island, Hong Kong",
      head: "Crowds packed Cheung Chau island this weekend for Hong Kong's annual Bun Festival, which climaxes at midnight with a race up a fourteen-metre tower stacked with 9,000 steamed buns.",
      dek:  "Every year on the ninth day of the fourth lunar month, the traffic-free island of Cheung Chau holds a four-day festival honouring the sea deity Pak Tai — whose statue is said to have ended a nineteenth-century plague — with the climax a timed midnight scramble in which twelve finalists race to grab as many buns as possible from a fourteen-metre bamboo tower, buns at greater height worth more points and said to carry greater luck. The day before, the Piu Sik parade carries children costumed as deities and folk heroes through the island's narrow alleyways on hidden stilts, a centuries-old offering tradition that evolved into a spectacle drawing tens of thousands of visitors each May. The Cheung Chau Bun Festival sits on China's national Intangible Cultural Heritage list; this year's Piu Sik ran on 24 May and the midnight scramble followed on 25 May.",
      src:  "Hong Kong Free Press / Timeout Hong Kong",
      url:  "https://hongkongfp.com/2026/05/26/hkfp-lens-crowds-flock-to-cheung-chau-for-annual-bun-festival-race-and-pui-sik-parade/",
      img:  "https://images.unsplash.com/photo-1543349689-9a4d426bee8e?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "Boston, USA / Global",
      head: "An oral drug called daraxonrasib nearly doubled median overall survival for patients with metastatic pancreatic cancer in a Phase 3 trial — the first RAS inhibitor to do so.",
      dek:  "In the RASolute 302 trial of 500 patients with previously treated metastatic pancreatic cancer, daraxonrasib — a multi-selective RAS(ON) inhibitor taken by mouth — extended median overall survival to 13.2 months, against 6.7 months on standard chemotherapy, a hazard ratio of 0.40. The drug also achieved a 31.6 percent objective response rate compared to 11.2 percent for chemotherapy; results were presented at the ASCO Annual Meeting plenary session on 31 May and published simultaneously in the New England Journal of Medicine. Pancreatic cancer has long been among the hardest cancers to treat systemically; this is the first time a RAS-pathway drug has demonstrated a survival benefit in a pivotal randomised trial, and RAS mutations are present in more than 90 percent of pancreatic cancers.",
      src:  "Dana-Farber Cancer Institute / Revolution Medicines / New England Journal of Medicine",
      url:  "https://www.dana-farber.org/newsroom/news-releases/2026/rason-inhibitor-doubles-median-overall-survival-in-results-of-phase-3-trial-for-patients-with-metastatic-pancreatic-cancer",
      img:  "https://images.unsplash.com/photo-1579165466741-7f35e4755169?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "29 European countries",
      head: "Twenty-nine European countries dismantled 603 river barriers in 2025, reconnecting 3,740 kilometres of waterway in the fifth consecutive year to set a new continental record.",
      dek:  "Across 29 countries in 2025, European nations removed 603 obsolete dams, weirs, sluices, and culverts — an 11 percent increase over 2024's then-record 542 removals — cumulatively reconnecting more than 3,740 kilometres of previously fragmented waterway. Sweden led with 173 removals, followed by Finland and Spain; Iceland and North Macedonia each removed their first-ever river barrier, and the initiative has now restored free flow through tens of thousands of kilometres since records began. Freshwater migratory fish populations have fallen 75 percent in Europe since 1970 largely due to such barriers; the programme brings the EU measurably closer to its legal commitment to restore 25,000 kilometres of free-flowing river by 2030.",
      src:  "Dam Removal Europe / Wetlands International Europe",
      url:  "https://europe.wetlands.org/new-record-for-dam-removal-in-europe-with-over-600-barriers-dismantled/",
      img:  "https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Minqin County, Gansu, China",
      head: "In Minqin County, Gansu, a local graduate's call drew 30,000 volunteers to plant a million drought-resistant trees against the desert advancing on three sides.",
      dek:  "In Minqin County — wedged between the Tengger and Badain Jaran deserts, with 94 percent of its land at desertification risk — a young graduate named Zhong Lin began raising funds in 2024 by selling the county's farm produce online and posting short videos about the crisis, eventually drawing more than 30,000 volunteers who paid their own travel costs to plant saxaul, whitethorn, and licorice saplings across a million plots of sandy ground. His effort was amplified by the reality show Become a Farmer and broad social media sharing, drawing participants predominantly aged 20 to 35 from across China. A satellite monitoring team is now tracking which species are taking root, and a second annual planting drive is already under way.",
      src:  "Good News Network / Sixth Tone",
      url:  "https://www.goodnewsnetwork.org/30000-volunteers-respond-to-countys-call-to-help-combat-desertification-and-plant-1-million-trees/",
      img:  "https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Small Wonders",
      place: "St Kilda, Scotland, UK",
      head: "The wrens of Scotland's St Kilda weigh twice as much as their mainland relatives — and a new study says they are quietly becoming a new species.",
      dek:  "Mainland British wrens weigh 7 to 10 grams; the wrens of the remote, uninhabited St Kilda archipelago weigh 13 to 16 grams — placing them among the top 25 percent of all documented cases of island gigantism in birds worldwide. A study from the University of Birmingham, published 28 May in the Evolutionary Journal of the Linnean Society, found that St Kilda and Shetland wrens evolved their larger size independently from the same ancestor via parallel evolution, with songs and genetics now distinct enough that interbreeding with mainland birds is unlikely. Lead researcher Dr Michal Jezierski called it evolution in real time: the world's most familiar small garden bird is, on a few wave-battered Atlantic islands, on its way to becoming something new.",
      src:  "University of Birmingham / Evolutionary Journal of the Linnean Society",
      url:  "https://www.sciencedaily.com/releases/2026/05/260528082453.htm",
      img:  "https://images.unsplash.com/photo-1444464666168-49d633b86797?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Nature",
      place: "Maasai Mau Forest, Kenya",
      head: "Trail cameras in a fragment of Kenyan highland forest have captured three mountain bongos in a place where the species was presumed locally extinct.",
      dek:  "Camera traps in the Maasai Mau forest fragment — roughly 200 kilometres from the species' main confirmed range in the Aberdares — filmed a mature male, a young male, and a young female mountain bongo, animals in a forest previously considered outside their known presence. Fewer than 40 mountain bongos survive in the wild; roughly 900 exist only in captivity, making any wild presence in a previously unmonitored forest significant. The Mountain Bongo Project published the footage on World Bongo Day, calling the finds reinforcement for protecting forest corridors between isolated highland fragments so that small groups may eventually reconnect.",
      src:  "Good News Network / Mountain Bongo Project / Chester Zoo",
      url:  "https://www.goodnewsnetwork.org/incredibly-rare-bongos-caught-on-trail-cam-in-area-they-were-thought-to-be-extinct/",
      img:  "https://images.unsplash.com/photo-1547471080-7cc2caa01a7e?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
