<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 462 · Fri, June 5, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Friday, June 5, 2026",
  edition: 462,
  stories: [
    {
      cat: "Everyday Joy",
      place: "Spello, Umbria, Italy",
      head: "In Spello, Umbria, every Corpus Christi the town's neighbourhood groups spend the night laying a two-kilometre carpet of fresh flower petals across the medieval streets — and a Sunday morning procession walks it to pieces.",
      dek:  "On the night of 6 June 2026, twelve competing neighbourhood groups carry tonnes of freshly pressed petals, seeds, and mosses from the surrounding Umbrian hills into Spello's old town, working through the dark to assemble elaborate geometric, botanical, and sacred designs across the cobblestones before dawn; the tradition has been observed every year since 1831. Each team designs its section months in advance, spending hours on precise assembly — a carpet that exists for the two or three hours of the Sunday Corpus Christi procession, after which the feet of participants reduce it to a sheet of crushed colour. Spello's Infiorata is inscribed as national cultural heritage and covers almost three kilometres of the historic alleys, making it one of the oldest and most elaborate of the eighteen such festivals held across central Italy each Corpus Christi.",
      src:  "Comune di Spello / Idealista.it / A Week in Umbria",
      url:  "https://www.idealista.it/news/vacanze/mete-turistiche/2026/05/28/380784-infiorate-di-spello-2026-48-ore-di-petali-arte-e-sapori",
      img:  "https://images.unsplash.com/photo-1467269204594-9661b134dd2b?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Nature",
      place: "Sønderjylland, Denmark",
      head: "Denmark now has thirteen breeding white stork pairs — the highest count since 1991 — as two entirely new nesting sites established themselves in Sønderjylland and outside Roskilde this spring.",
      dek:  "The spring 2026 survey by Storkene.dk — a 1,600-member conservation group that has tracked Denmark's stork nests since the 1980s — recorded thirteen breeding pairs, up from eleven last year and the most since 1991, following decades of volunteer nest-platform installation and habitat management across the wetlands where the birds hunt frogs, worms, and small invertebrates. Favourable rainfall improved food availability across the meadows this season; the group projects 32 to 33 fledglings will take wing by late summer, with the two entirely new sites representing the first storks nesting in those locations within living memory. White storks had nearly vanished from Denmark across the twentieth century; each pair that settles in a new place is a small, verifiable proof that the habitat restoration is holding.",
      src:  "Storkene.dk / Daily Northern",
      url:  "https://www.dailynorthern.com/20515/denmark-records-highest-number-of-breeding-white-stork-pairs-in-35-years/",
      img:  "https://images.unsplash.com/photo-1444464666168-49d0855cf9d4?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "Yale School of Medicine, Connecticut",
      head: "It is the type of dietary fat — not the amount — that determines how fast pancreatic tumours grow, a Yale study published in Cancer Discovery finds, establishing the first biological rationale for a dietary trial in a cancer with a 13 percent five-year survival rate.",
      dek:  "Researchers at Yale School of Medicine tested twelve high-fat diets in mice with KRAS mutations matching human pancreatic cancer — keeping all diets identical in calories while varying fat sources — and found tumours grew significantly faster in mice fed oleic-acid-rich diets (the dominant fat in olive oil) and 50 percent slower in mice fed omega-3-rich fish-oil diets. The mechanism is ferroptosis: polyunsaturated fats sensitise cancer cells to a form of programmed death triggered by lipid oxidation, while monounsaturated fats protect the cells from it — a distinction no calorie-counting approach captures. Published 2 June 2026 in Cancer Discovery, the findings establish the rationale for human dietary trials in pancreatic cancer, where almost no therapeutic progress has been made against a disease that kills nine in ten patients within five years.",
      src:  "Yale School of Medicine / Cancer Discovery (AACR)",
      url:  "https://medicine.yale.edu/news-article/type-of-fat-not-the-amount-fuels-pancreatic-cancer/",
      img:  "https://images.unsplash.com/photo-1576086213369-97a306d36557?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Bretton, Peterborough, England",
      head: "For fifteen years, a retired chef named Lana has run a weekly community club for isolated older adults in Peterborough — first as the cook, now leading a team of seven volunteers.",
      dek:  "After retiring and losing her husband in quick succession, Lana joined the Bretton Friendship Club and began cooking hot lunches; over fifteen years she took on the club's coordination, building a weekly four-hour programme of meals, quizzes, and bingo that draws in older residents who would otherwise spend the week without company. Members who arrived as strangers have since begun holidaying together, and several have been connected through the club to welfare entitlements they had not previously known to claim. Its continued existence across fifteen years of Tuesdays is the measure of success.",
      src:  "Age UK Cambridgeshire and Peterborough",
      url:  "https://www.ageuk.org.uk/cambridgeshireandpeterborough/about-us/news/articles/2026/volunteers-week-volunteer-spotlight/",
      img:  "https://images.unsplash.com/photo-1543269865-cbf427effbad?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Small Wonders",
      place: "Wales & Italy",
      head: "A biting fly found across Europe and Asia sheds its wings the moment it lands on a deer — and new research confirms it then quietly scales back its own eyesight, redirecting the energy to digestion.",
      dek:  "Researchers at Aberystwyth University and the University of Florence measured five opsin genes in the deer ked (Lipoptena cervi) at two life stages — winged host-seeker and wingless permanent parasite — and found visual sensitivity drops to roughly half once the fly has shed its wings and settled onto a host for life. The fly does not go blind; it precisely scales back the investment in sight it no longer requires, redirecting metabolic resources toward feeding and reproduction — a quietly specific biological economy. The study, published in the Journal of Experimental Biology on 1 June 2026, is the first documented case of an insect actively downsizing its visual system in response to a change in lifestyle.",
      src:  "Aberystwyth University / University of Florence / Journal of Experimental Biology",
      url:  "https://www.eurekalert.org/news-releases/1129358",
      img:  "https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "Zambia",
      head: "Zambia's Rural Electrification Authority handed over 85 completed grid-extension projects on June 3 — its highest single-year delivery, at nearly three times the programme's historical rate.",
      dek:  "The 85 projects, valued at K463 million, were handed over to the national utility ZESCO, representing an annual completion rate of 36 projects against the REA's previous average of 13 — the fastest delivery since the agency was founded. The 2026 electrification plan targets 52,730 new household connections alongside power for 655 schools, 89 rural health centres, and 80 public facilities across multiple provinces. Officials noted that grid electricity in schools enables pupils to study after dark and allows health posts to refrigerate vaccines and run diagnostic equipment for the first time, directly expanding access to services in communities that transmission lines previously bypassed.",
      src:  "Zambia Daily Mail",
      url:  "https://www.daily-mail.co.zm/2026/06/03/rural-electrification-reducing-inequality/",
      img:  "https://images.unsplash.com/photo-1489171078254-c3365d6e359f?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
