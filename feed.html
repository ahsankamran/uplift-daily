<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 447 · Thu, May 21, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Thursday, May 21, 2026",
  edition: 447,
  stories: [
    {
      cat: "Small Wonders",
      place: "Hervey Bay, Australia",
      head: "Tail photographs confirm two humpback whales crossed the Pacific between Australia and Brazil, setting the longest individual migration distances ever recorded for the species.",
      dek:  "Scientists at Griffith University, comparing tens of thousands of whale-tail photographs shared by volunteer networks across the South Pacific, identified two individual humpbacks documented in both Hervey Bay, Queensland and off the coast of Brazil. One animal, first photographed off Queensland in 2007, was spotted off São Paulo in 2019 — a confirmed crossing of more than 14,000 kilometres; a second, first recorded at Brazil's Abrolhos Bank in 2003, was found alone in Hervey Bay in September 2025, clocking roughly 15,100 kilometres — the longest confirmed distance between sightings of any individual humpback. The study, published in Royal Society Open Science on 19 May, upends the assumption that South Pacific and South Atlantic humpback populations breed in entirely separate basins.",
      src:  "Griffith University / Royal Society Open Science",
      url:  "https://news.griffith.edu.au/2026/05/20/intrepid-tails-fluke-photos-confirm-humpback-whales-mount-14000km-ocean-crossing-to-breeding-grounds/",
      img:  "https://images.unsplash.com/photo-1548550023-2bdb3c5beed7?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Everyday Joy",
      place: "Taipei, Taiwan",
      head: "Taiwan Travelogue, set in Japanese-occupied Taiwan in 1938, becomes the first novel translated from Mandarin Chinese to win the International Booker Prize.",
      dek:  "Yáng Shuāng-zǐ's debut novel — presented as a Mandarin translation of a rediscovered Japanese travel memoir, following a writer on a government tour of Taiwan who develops an unlikely relationship with her interpreter — was awarded the £50,000 prize on 19 May, split equally between the author and translator Lin King. It is the first work translated from Mandarin Chinese to win in the prize's twenty-year history, and Yáng and King become the first Taiwanese and Taiwanese-American International Booker laureates. The judges described the novel as one that 'layers history into intimacy' and illuminates a chapter of Taiwan's past that most readers have never encountered.",
      src:  "The Booker Prizes",
      url:  "https://thebookerprizes.com/the-booker-library/prize-years/international/2026",
      img:  "https://images.unsplash.com/photo-1519638831568-d9897f54ed69?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "Erlangen, Germany",
      head: "A nanometre-scale imaging technique maps the sugar coating on human cell surfaces and can distinguish healthy tissue from cancerous tissue by molecular pattern alone.",
      dek:  "Researchers at the Max Planck Institute for the Science of Light published a method called glycan atlassing in Nature Nanotechnology on 14 May, producing the first maps of the glycocalyx — the thin sugar layer covering every human cell — at nanometre resolution, finding that the arrangement shifts distinctly depending on whether a cell is healthy, immune-activated, or at a stage of cancer development. Applied to human breast tissue samples, the patterns reliably distinguished cancerous regions from healthy regions in the same biopsy. Because the patterns shift early in disease progression, the team says glycan atlassing could eventually enable cancer screening before conventional biomarkers are detectable.",
      src:  "Max Planck Institute / Nature Nanotechnology",
      url:  "https://www.sciencedaily.com/releases/2026/05/260517211431.htm",
      img:  "https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Tapi district, Gujarat, India",
      head: "A village leader in Gujarat has spent three years making one-minute videos explaining welfare schemes, so that neighbours who qualify can actually claim what they are owed.",
      dek:  "Ripin Gamit, the 33-year-old elected sarpanch of Chikalda in Gujarat's Tapi district, began filming short Gujarati-language videos in July 2025 after discovering that many residents — most from the Gamit tribe — were unaware of pension, disability, and farming support schemes for which they qualified. He reads 15- to 20-page government circulars, reduces each to a one-minute reel, posts them to Instagram, and guides applicants through the process in his own time; he has now made more than 50 such videos. Gamit Vipul, a 20-year-old farmer's son born with a motor disability who found the reel on disability pensions, contacted Ripinbhai and now receives a monthly payment he is using to study for a railway service examination.",
      src:  "Reasons to Be Cheerful",
      url:  "https://reasonstobecheerful.world/indian-village-leader-viral-explainer-videos",
      img:  "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Nature",
      place: "Kei Islands, Indonesia",
      head: "A nine-year conservation partnership in Indonesia's Kei Islands has cut leatherback turtle poaching by 85 percent on the beaches where the species nests.",
      dek:  "In the Kei Islands of eastern Indonesia, a programme run by NOAA, WWF United States, and WWF Indonesia has reduced the number of leatherback turtles and nests taken for consumption from roughly 60 percent of nests annually to fewer than 1 percent since the partnership began in 2017 — an 85 percent reduction in poaching across the programme's main beaches, reported for Endangered Species Day on 15 May. The work rests on community monitoring, locally driven data collection, and sustained conversations with coastal villages about legal protection and the turtles' cultural role in Kei custom. Leatherbacks — the world's largest sea turtle — make a transoceanic migration from their Indonesian nesting beaches to foraging grounds along the Pacific Coast of North America, and the Kei Islands hold some of the Indo-Pacific population's most important sites.",
      src:  "NOAA Fisheries / WWF Indonesia",
      url:  "https://www.fisheries.noaa.gov/feature-story/recovering-endangered-indo-pacific-leatherback-turtles",
      img:  "https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "Bujumbura, Burundi",
      head: "Burundi has eliminated trachoma as a public health problem, capping twenty years of community-wide antibiotic campaigns in one of central Africa's most densely populated nations.",
      dek:  "The World Health Organization certified Burundi's elimination at the 79th World Health Assembly in Geneva on 19 May, making it the 24th country globally — and the eighth in the African region — to reach the trachoma elimination milestone. The achievement required two decades of the SAFE strategy: Surgery for corneal scarring, Antibiotics distributed annually across entire communities, Facial cleanliness education, and Environmental improvements to latrines and water points, coordinated across a country of more than 14 million people. With Burundi's validation, the global population still needing trachoma interventions — which stood at 1.5 billion in 2002 — has now fallen below 100 million for the first time.",
      src:  "WHO / 79th World Health Assembly",
      url:  "https://www.who.int/news/item/19-05-2026-seventy-ninth-world-health-assembly---daily-update--19-may-2026",
      img:  "https://images.unsplash.com/photo-1576091160550-2173dba999ef?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
