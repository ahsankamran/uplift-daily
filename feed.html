<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 448 · Fri, May 22, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Friday, May 22, 2026",
  edition: 448,
  stories: [
    {
      cat: "Nature",
      place: "Bismarck Sea, Papua New Guinea",
      head: "Papua New Guinea designates 200,000 square kilometres of the Coral Triangle as a strictly no-take marine protected area, the largest in Melanesian history.",
      dek:  "At the inaugural Melanesian Ocean Summit in Port Moresby on 14 May, Papua New Guinea's fisheries minister announced the Western Manus Marine Protected Area, covering roughly 200,000 km² of the Bismarck Sea — an expanse the size of the United Kingdom — where all fishing and extraction is now prohibited, protecting critical migration corridors and breeding grounds for hammerhead sharks, humpback whales, manta rays, and hundreds of reef species. The reserve joins a new transboundary network called the Melanesian Ocean Corridor of Reserves, formed with Fiji and Vanuatu, with a shared target of six million km² of protected Pacific waters by 2030. The Coral Triangle, home to roughly 75 percent of all coral species on Earth, now sits at the centre of the most ambitious marine protection expansion Melanesia has undertaken.",
      src:  "Oceanographic Magazine / Islands Business",
      url:  "https://oceanographicmagazine.com/news/papua-new-guinea-announces-largest-mpa-in-its-history/",
      img:  "https://images.unsplash.com/photo-1559827260-dc66d52bef19?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "Santiago, Chile",
      head: "Chile becomes the first country in the Americas to receive WHO verification for eliminating leprosy, thirty years after its last locally acquired case.",
      dek:  "The World Health Organization formally presented Chile with its certificate of achievement at the 79th World Health Assembly in Geneva on 19 May, confirming that the country has recorded zero locally transmitted leprosy cases since 1993 — more than three unbroken decades. Chile is now only the second country in the world, after Jordan, to reach the WHO elimination threshold: no new autochthonous cases for at least three consecutive years, following at least five years of interrupted transmission. The certification makes Chile the 61st country globally, and the sixth in the Americas, to eliminate at least one neglected tropical disease.",
      src:  "WHO / PAHO",
      url:  "https://www.who.int/news/item/04-03-2026-chile-becomes-the-first-country-in-the-americas-to-be-verified-by-who-for-the-elimination-of-leprosy",
      img:  "https://images.unsplash.com/photo-1520808663317-647b476a81b9?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "11 countries",
      head: "An mRNA seasonal flu vaccine proved 26 percent more effective than a standard influenza shot across more than 40,000 participants in the largest head-to-head trial yet published.",
      dek:  "Moderna's mRNA-1010 vaccine was compared with a licensed standard-dose influenza vaccine in a Phase 3 randomised trial enrolling 40,000 adults aged 50 and older across eleven countries during the 2024–25 Northern Hemisphere flu season, with results published in the New England Journal of Medicine on 6 May. Participants who received mRNA-1010 experienced a flu-like illness rate of 2.0 percent versus 2.8 percent for the comparator, yielding a relative vaccine efficacy of 26.6 percent overall and roughly 29 percent against the dominant A/H1N1 strain. Influenza causes between 290,000 and 650,000 deaths annually worldwide; a reliable improvement of this magnitude, if confirmed across further seasons, would represent tens of thousands of preventable deaths per year.",
      src:  "Moderna / New England Journal of Medicine",
      url:  "https://www.nejm.org/doi/full/10.1056/NEJMoa2516491",
      img:  "https://images.unsplash.com/photo-1584118624012-df056829fbd0?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Cities and villages, Ireland",
      head: "Ireland's national community street lunch weekend returns for its sixteenth year on Saturday and Sunday, with a target of 1,200 neighbourhood feasts.",
      dek:  "Street Feast invites anyone across Ireland to register a table on their street, green, laneway, or car park and invite neighbours for a shared lunch — free to attend, free to organise, accompanied by a party pack posted to any household that signs up. Last year 962 neighbourhoods took part and an estimated 88,000 people gathered; three-quarters of hosts said their neighbourhood felt friendlier afterwards, and 43 percent of participants met someone from a different cultural background for the first time. This year's 1,200-feast target, if reached, would be the largest Street Feast in the event's history.",
      src:  "StreetFeast.ie / DLR County Council",
      url:  "https://streetfeast.ie/",
      img:  "https://images.unsplash.com/photo-1529543544282-ea669407fca3?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Everyday Joy",
      place: "Tancítaro, Michoacán, Mexico",
      head: "Eight hundred volunteer cooks in the self-styled Avocado Capital of the World assembled 6,800 kilograms of guacamole at the thirteenth annual festival and reclaimed the world record.",
      dek:  "On 10 April, at the Feria del Aguacate in Tancítaro — a municipality that produces an estimated 30 percent of Mexico's avocado crop — 800 volunteers spent about two and a half hours mixing, mashing, and seasoning a bowl of guacamole that Guinness World Records confirmed weighed 6,800.5 kilograms (14,992.53 lbs), edging past a rival mark held by neighbouring Peribán since 2022. The record was certified by Guinness on 18 May. The festival has run every year since 2014, and in most editions the finished bowl is distributed free to the crowd.",
      src:  "Guinness World Records",
      url:  "https://www.guinnessworldrecords.com/news/commercial/2026/5/holy-guacamole-mexican-city-makes-nearly-15000-pounds-of-dip-during-avocado-festival",
      img:  "https://images.unsplash.com/photo-1553484771-047a44eee27b?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Small Wonders",
      place: "Cloud forests, Mexico & Central America",
      head: "Cloud-forest mice inflate a throat air sac to whistle their ten-second songs — a mechanism researchers describe as unique among animals.",
      dek:  "Alston's singing mouse (Scotinomys teguina), a thumb-sized rodent of the mountain forests of southern Mexico, Guatemala, and Costa Rica, produces complex songs of roughly 100 individual notes over about ten seconds, each male having a distinct arrangement used to attract mates and warn rival males. Samantha Khouri Smith and colleagues at the University of Lausanne used micro-CT imaging and surgical experiments to show that the mice pump air through the larynx into an enlarged ventral throat pouch — creating a whistle resonance chamber not previously documented in any other animal — with the cricothyroid muscle governing pitch by altering laryngeal shape. The study was published in the Proceedings of the Royal Society B, Volume 293, in May 2026.",
      src:  "University of Lausanne / Proceedings of the Royal Society B",
      url:  "https://royalsocietypublishing.org/doi/10.1098/rspb.2026.0153",
      img:  "https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
