<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 457 · Sun, May 31, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Monday, June 1, 2026",
  edition: 458,
  stories: [
    {
      cat: "Nature",
      place: "Amazon Basin, Brazil",
      head: "Brazil's Amazon lost less forest in 2025 than in any year since monitoring began — and deforestation across all Brazilian biomes fell 20.6 percent, a record low.",
      dek:  "The MapBiomas satellite-monitoring consortium — a coalition of universities, tech companies, and research institutes — recorded 985,000 hectares of native vegetation lost across Brazil in 2025, a 20.6 percent drop from 2024 and the lowest total since systematic records began in 2019. In the Amazon basin itself, home to roughly ten percent of all life on Earth, forest loss fell by 23.5 percent — a decline that the network's technical coordinator, Marcos Rosa, links directly to sustained enforcement operations and sanctions across all biomes. The figures confirm a multi-year trajectory: Amazon deforestation has fallen by more than half since its 2022 peak, and four of Brazil's six biomes each set their own monitoring-era records for low forest loss in 2025.",
      src:  "MapBiomas / AFP / Phys.org",
      url:  "https://phys.org/news/2026-05-deforestation-brazil-amazon-lowest.html",
      img:  "https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Small Wonders",
      place: "Seychelles, Indian Ocean",
      head: "DNA taken from 200-year-old museum specimens has solved a 250-year puzzle: the crocodiles of the Seychelles swam at least 3,000 kilometres across the open Indian Ocean to get there.",
      dek:  "Researchers at Germany's Bavarian State Collections of Natural History analysed mitochondrial genomes from preserved specimens of the Seychelles crocodile — which vanished within fifty years of European settlers arriving in 1770 — and found that the animals were not a unique island species but an isolated population of saltwater crocodiles that must have drifted from the Asian or East African mainland. Published 28 May in Royal Society Open Science, the study shows that saltwater crocodiles, the only reptile equipped with salt-excreting glands for sustained ocean crossings, covered at least 3,000 kilometres of open water to reach an archipelago where no land reptile had previously existed. Before settlers exterminated them within fifty years, the Seychelles population formed the westernmost tip of a range stretching more than 12,000 kilometres to Vanuatu in the Pacific.",
      src:  "Bavarian State Collections of Natural History, Germany / Royal Society Open Science",
      url:  "https://www.sciencedaily.com/releases/2026/05/260528082503.htm",
      img:  "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Evenlode Valley, Oxfordshire, England",
      head: "More than fifty Cotswolds farmers have pooled 3,000 hectares of land to let their shared rivers run free again — and three catchments are measurably cleaner after two years of work on the ground.",
      dek:  "The North East Cotswold Farmer Cluster, a co-operative of more than fifty land managers and tenant farmers, is restoring the valleys of the Evenlode, Glyme, and Dorn rivers by reconnecting floodplains, creating wetlands, and pulling grazing back from riverbanks — pooling across property boundaries a risk and cost that no single farm could carry alone. The project has secured more than £3 million in blended investment from Network Rail and Scottish and Southern Electricity Networks, both of which benefit when flood peaks are absorbed upstream before reaching infrastructure downstream. Water quality monitoring published in May shows measurable improvements across all three river catchments within two years of fieldwork beginning, a pace that project managers say demonstrates the model can be replicated widely across England.",
      src:  "Evenlode Landscape Recovery Project / Water Magazine",
      url:  "https://www.watermagazine.co.uk/2026/05/26/the-evenlode-blueprint-for-upstream-water-resilience/",
      img:  "https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Everyday Joy",
      place: "Cambridge, England",
      head: "England's first Dutch-style \"cycle street\" has opened in Cambridge, where 3,000 cyclists a day now have legal right of way over cars on a road redesigned around bikes.",
      dek:  "Adams Road, which runs beside Cambridge University Library and carries an estimated 3,000 cyclists each day, has been redesigned as England's first fietsstraat — a road type common across the Netherlands where motorists are legally guests, may not overtake cyclists, and must yield at all junctions. The £2.4 million scheme raised crossings to road level, removed on-road parking, widened footpaths, and planted rainwater gardens to manage surface water along the route. The Greater Cambridge Partnership says Adams Road will serve as a template for a rolling programme of similar conversions across a city where cycling already outnumbers driving on the most-used commuter routes.",
      src:  "Cycling Weekly / road.cc / Greater Cambridge Partnership",
      url:  "https://www.cyclingweekly.com/news/imagine-a-road-where-cars-are-not-allowed-to-overtake-bikes-englands-first-cycle-street-opens",
      img:  "https://images.unsplash.com/photo-1558980664-769d59546b3d?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "University of Granada, Spain",
      head: "A study of 268 people aged 8 to 34 finds that rhythmic musical training — not melody or ear training — is what sharpens sustained attention at every stage of development.",
      dek:  "Researchers at the Mind, Brain and Behaviour Research Centre at the University of Granada recruited 268 musicians and non-musicians aged 8 to 34 and measured their performance on demanding attention tasks; musicians at every age responded faster and produced measurably fewer concentration lapses than matched non-musicians. The study, published in Communications Psychology, identified rhythmic skill — precise synchronisation of movement with a beat — as the active mechanism, operating through improvements in both sustained attention and phonological processing rather than any general advantage in processing speed. The finding suggests that rhythm-focused music education, even in brief formats, may produce lasting cognitive gains independent of musical achievement — a case the authors say is relevant to schools weighing the cost of dedicated arts time.",
      src:  "University of Granada / Communications Psychology (Nature)",
      url:  "https://www.nature.com/articles/s44271-026-00444-5",
      img:  "https://images.unsplash.com/photo-1520523839897-bd0b52f945a0?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "Worldwide",
      head: "Global teenage birth rates have fallen by more than 40 percent since 2000, with every major world region now below its year-2000 figure and Central and South Asia recording a decline of more than three-quarters.",
      dek:  "United Nations data compiled by Our World in Data shows the global adolescent birth rate — live births per 1,000 girls aged 15 to 19 — fell from 66 in 2000 to 38 in 2024, a decline driven in every region by rising rates of girls' secondary school enrolment and expanding access to reproductive health services. The sharpest improvement came in Central and South Asia, where the rate fell from 106 to 25, a reduction of more than three-quarters; Latin America and the Caribbean fell from 83 to 50, and Sub-Saharan Africa from 129 to 93. For the first time since records began, no major world region now reports a rate above 100 births per 1,000 adolescent girls — a threshold that marked much of the developing world at the turn of the millennium.",
      src:  "Our World in Data / United Nations",
      url:  "https://ourworldindata.org/data-insights/teenage-pregnancy-rates-have-fallen-across-the-world",
      img:  "https://images.unsplash.com/photo-1516321165247-4aa89a48be55?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
