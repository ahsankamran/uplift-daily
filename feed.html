<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
  overflow: hidden;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }

/* Mobile — prevent content overflowing into top chrome */
@media (max-width: 600px) {
  .card-inner {
    padding: 64px 20px 80px;
  }
  .headline {
    font-size: clamp(22px, 5vw, 32px);
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    overflow: hidden;
    font-size: 14px;
  }
  .cover-wordmark {
    font-size: clamp(40px, 12vw, 72px);
  }
  .bottom {
    padding: 14px 18px 20px;
  }
}
@media (max-height: 700px) {
  .card-inner {
    padding-top: 56px;
    padding-bottom: 72px;
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
  }
}
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 556 · Tue, November 3, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Tuesday, November 3, 2026",
  edition: 556,
  stories: [
    {
      cat: "Nature",
      place: "River Ness catchment, Highland, Scotland",
      head: "Beavers are going back into the waters around Loch Ness after 500 years.",
      dek:  "NatureScot approved a licence on October 30 for Trees for Life and the Beaver Trust to release up to 15 beaver families into the River Ness catchment over three years, five centuries after the last beaver was recorded at the loch. The animals will come from farmland elsewhere in Scotland where they are damaging prime agricultural ground, be trapped under licence and health-screened before being moved; more than 73 percent of those who answered NatureScot's consultation supported the plan, and the agency says it is taking seriously the concerns raised by land managers, fisheries managers and people living in the catchment. The first releases could come within weeks, in a catchment NatureScot identified back in 2022 as one of the most suitable in Scotland.",
      src:  "STV News",
      url:  "https://news.stv.tv/highlands-islands/beavers-to-be-reintroduced-to-loch-ness-500-years-on-from-last-sighting",
      img:  "https://images.unsplash.com/photo-1727883760212-655dc564a99c?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Small Wonders",
      place: "University of Tübingen, Germany",
      head: "Two crows called Iggy and Lemmy decide what they are looking at twice as fast as we do.",
      dek:  "Andreas Nieder and Philipp Schmidbauer put two carrion crows in front of a touchscreen showing a cluster of dots, some drifting left or right and the rest moving at random, and the birds learned to tap the side matching the drift for a mealworm. Over thousands of trials, reported in Science on October 22, Iggy and Lemmy averaged 235 milliseconds a decision — roughly half the time monkeys and people take on comparable tasks, with no loss of accuracy — and electrodes picked up neurons in the nidopallium caudolaterale, the bird equivalent of a primate's prefrontal cortex, firing from 70 milliseconds after the dots appeared. Nieder reads it as evidence that quick, complicated computation needs no mammalian neocortex; whether other birds are as fast, nobody yet knows.",
      src:  "Smithsonian Magazine",
      url:  "https://www.smithsonianmag.com/smart-news/crows-can-make-decisions-based-on-visual-information-at-lightning-speed-roughly-twice-as-fast-as-humans-can-study-suggests-180989779/",
      img:  "https://images.unsplash.com/photo-1605207209791-dfe90cf9f16b?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "Desa'a forest, Tigray, Ethiopia",
      head: "A dry forest above Ethiopia's Rift Valley has been named a UN restoration flagship.",
      dek:  "The UN Environment Programme gave the Desa'a landscape World Restoration Flagship status on October 29 at the biodiversity conference in Yerevan, recognising more than 23,000 hectares of degraded ground now being brought back on the escarpment above the Great Rift Valley. Work started in 2016 with the forest charity WeForest and is now run by the communities living there; measurements credit it with holding back about 500,000 tonnes of soil, catching some 1.9 million cubic metres of rainwater a year, and lifting water infiltration in treated ground by 26 percent since 2019 while untreated ground fell 40 percent. Beekeeping and wider tree cover come next, and UNEP reckons the landscape could take up around 6 million tonnes of carbon dioxide equivalent over 50 years.",
      src:  "Mongabay",
      url:  "https://news.mongabay.com/2026/11/un-recognizes-ongoing-restoration-work-inside-ethiopias-desaa-forest-amid-conflict/",
      img:  "https://images.unsplash.com/photo-1572888195250-3037a59d3578?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Botton Village, North York Moors, England",
      head: "A Yorkshire village has organised its care around shared meals since 1955.",
      dek:  "About 120 people live at Botton Village in 19 households, each holding two or three co-workers, a similar number of villagers with learning disabilities, and usually one volunteer, in a community founded in 1955. The day runs on meals and workshops — breakfast at half past seven, workshop hours morning and afternoon, dinner at half past six — and roughly half of residents' meals are eaten in a neighbour's house rather than their own. Thomas Moore, the Sheffield researcher who wrote the piece, notes that arrangements of this kind cost about £26,000 less per person a year than conventional supported living, and that the Care Quality Commission rated 97 percent of them good or outstanding in 2023 against 78 percent across social care.",
      src:  "Positive News",
      url:  "https://www.positive.news/society/what-if-we-stopped-treating-social-care-like-a-service/",
      img:  "https://images.unsplash.com/photo-1570914678671-ec77d4cce9dd?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Everyday Joy",
      place: "Rembrandt House Museum, Amsterdam, Netherlands",
      head: "Rembrandt's etchings are going onto backs and arms in the house where he made them.",
      dek:  "On October 26 the Rembrandt House Museum in Amsterdam, where the painter lived and worked for 19 years, handed a room to a pop-up tattoo studio; six artists are inking his etchings onto visitors there until November 7. The designs run to lions, windmills, sailors, merchants, Hansken the elephant, the self-portraits and the signature, at roughly $110 to $390 each, and the largest is a full-back copy of the 1633 etching The Descent from the Cross on Bo Kwakernaak, 28, who was chosen to have it free across about 20 hours of sitting. Henk Schiffmacher, who leads the project and is running it a second time after 2023, calls it an honour to work \u201cin the very place where Rembrandt's spirit still lingers\u201d, and the final session falls on the night of November 7.",
      src:  "Smithsonian Magazine",
      url:  "https://www.smithsonianmag.com/smart-news/a-poor-Mans-rembrandt-for-a-few-hundred-bucks-at-amsterdams-rembrandt-museum-a-pop-up-tattoo-studio-is-inking-17th-century-masterpieces-on-human-canvases-180989800/",
      img:  "https://images.unsplash.com/photo-1643513456892-437e82e06f4a?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "74 centres in six countries",
      head: "Replacing a moderately narrowed heart valve early keeps people out of hospital.",
      dek:  "The PROGRESS trial, published in the New England Journal of Medicine, randomised 744 people aged 65 and over — average age 78 — with moderate aortic stenosis and at least one worrying sign, at 74 centres in six countries, either to a transcatheter valve replacement now or to careful monitoring. After two years, 16.7 percent of the valve group had died or had a heart failure event against 23.9 percent of those monitored, and admissions for heart failure ran at 7.4 percent against 14.9 percent; more than half the monitored group had a valve replaced within the two years anyway. The investigators are careful to say this does not mean every moderate narrowing should be treated, and they will follow both groups for ten years to see how the valves last.",
      src:  "Medical Xpress",
      url:  "https://medicalxpress.com/news/2026-11-earlier-valve-benefits-patients-moderate.html",
      img:  "https://images.unsplash.com/photo-1691935071222-c008a4ccc2ca?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
