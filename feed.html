<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
  overflow: hidden;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }

/* Mobile — prevent content overflowing into top chrome */
@media (max-width: 600px) {
  .card-inner {
    padding: 64px 20px 80px;
  }
  .headline {
    font-size: clamp(22px, 5vw, 32px);
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    overflow: hidden;
    font-size: 14px;
  }
  .cover-wordmark {
    font-size: clamp(40px, 12vw, 72px);
  }
  .bottom {
    padding: 14px 18px 20px;
  }
}
@media (max-height: 700px) {
  .card-inner {
    padding-top: 56px;
    padding-bottom: 72px;
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
  }
}
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 476 · Sat, June 20, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Saturday, June 20, 2026",
  edition: 476,
  stories: [
    {
      cat: "Small Wonders",
      place: "Lake Tuz, Türkiye",
      head: "More than five thousand flamingo chicks have hatched at Lake Tuz in central Turkey — more than double last year's count — after a water-pumping project reversed the drought damage that wiped out entire cohorts of nestlings in 2021.",
      dek:  "Drone footage shot on 10 June over Turkey's great salt flat counted roughly 5,000 greater flamingo chicks sheltering under their parents at one of the Eastern Mediterranean's most important flamingo breeding sites; the directorate for natural asset protection had begun pumping freshwater into the shallow nesting flats in 2022 after prolonged heat nearly dried the lake and killed thousands of young birds. The president of the Bird's Eye View and Ecology Association told Good News Network that the current chick count is more than double last year's, which was itself more than double the year before — suggesting the recovery is still accelerating.",
      src:  "Good News Network",
      url:  "https://www.goodnewsnetwork.org/thousands-of-flamingo-chicks-hatch-in-major-comeback-after-climate-disaster/",
      img:  "https://images.unsplash.com/photo-q4fxCjCj_GI?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Nature",
      place: "India, Nepal & Pakistan",
      head: "Twenty years after India, Nepal, and Pakistan banned a cattle drug that had reduced vulture populations by 99.9%, captive-bred white-rumped vultures are now raising wild chicks of their own.",
      dek:  "The RSPB-supported Saving Asia's Vultures from Extinction consortium has bred 740 birds across four specialised centres and released more than 110 into protected tiger reserves since 2006, when the veterinary use of diclofenac was banned after surveys confirmed it had nearly wiped out three vulture species across the subcontinent. The first cohort released in Haryana in 2020 is now breeding naturally without human support, and 31 birds released from West Bengal have dispersed across India, Nepal, and Bhutan with zero recorded poisoning deaths.",
      src:  "RSPB / Saving Asia's Vultures from Extinction",
      url:  "https://www.rspb.org.uk/whats-happening/news/spotlight-on-asias-vultures-twenty-years-after-game-changing-drug-ban",
      img:  "https://images.unsplash.com/photo-Pc5Yv7QX4Ts?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "London, UK",
      head: "London's clean-air zones have cut emergency hospital admissions for heart disease at a rate of 8.1 percent per year since the scheme began — the first study to measure the effect directly against a matched control area.",
      dek:  "Imperial College London researchers compared emergency admission data from inside and outside central London's Ultra Low Emission Zone and its predecessor the T-charge, covering January 2014 to March 2020; cardiovascular admissions fell by 8.1% per year in the zone, respiratory disease admissions by 6.2%, and all-cause emergency admissions by 3.1%. Published on 12 June in Environment International and led by Dr Rosemary Chamberlain, the study drew on a control area in outer London to isolate the effect of the air-quality policy from broader health trends.",
      src:  "Imperial College London / Environment International",
      url:  "https://www.imperial.ac.uk/news/articles/2026/londons-ulez-and-t-charge-linked-to-reductions-in-emergency-hospital-admissions/",
      img:  "https://images.unsplash.com/photo-LcuBRr7pRCc?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Mumbai, India",
      head: "Each Sunday morning at 4 a.m., a Mumbai couple wake, cook, and serve breakfast to a hundred people — a routine they have kept for nearly three years and fifteen thousand meals.",
      dek:  "Pooja and Dipesh Dedhia rise before dawn every Sunday and prepare fresh food through the Matoshree Foundation for daily-wage workers and neighbours in their area; they fund the meals themselves, without grants or donors, and involve their children in the cooking. The couple told The Better India on 17 June that they have not missed a single Sunday in three years and have served more than 15,000 meals — the name Matoshree, a Marathi word for a beloved mother, reflecting the feeling they want anyone at their table to carry through the working week.",
      src:  "The Better India",
      url:  "https://thebetterindia.com/changemakers/pooja-dipesh-dedhia-matoshree-foundation-mumbai-sunday-breakfast-meals-12039100",
      img:  "https://images.unsplash.com/photo-EEzYovNQYss?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "São Tomé and Príncipe",
      head: "São Tomé and Príncipe's president has signed the nation's first marine protected areas into law — two coastal reserves protecting coral reefs, shark nursery grounds, and sea-turtle nesting beaches.",
      dek:  "President Carlos Vila Nova approved the first two reserves around the islets of Santana and Ilhéu das Rolas this month, with six more sites in Príncipe's coastal waters to be gazetted before the end of 2026; the protected areas were designed with Fauna & Flora and local fishing communities, who helped shape sustainable-use zones that permit traditional artisanal gear while banning industrial trawling and seabed extraction. The eight Marine Protected Areas together represent the small Gulf of Guinea nation's first formal step toward protecting 30 percent of its coastal waters by 2030.",
      src:  "Fauna & Flora",
      url:  "https://www.fauna-flora.org/news/minister-announces-eight-new-marine-protected-areas-for-sao-tome-and-principe/",
      img:  "https://images.unsplash.com/photo-DDA1vq93tzk?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Everyday Joy",
      place: "Malmö to Oslo, Sweden & Norway",
      head: "A new daytime train from Malmö to Oslo launched on 15 June — a six-and-a-half-hour journey through Gothenburg's waterfront, Sweden's ancient lake country, and granite gorges, with a dining car serving food sourced from communities along the route.",
      dek:  "Snälltåget's Malmö–Oslo service follows Sweden's western coast through Helsingborg, Halmstad, and Varberg before threading north through the forests and lakes of Dalsland — past Bohus Fortress and into Norway via Sarpsborg — with a restaurant car called Krogen, where dishes are made from local ingredients gathered along the line. One-way fares start at 149 Swedish kronor, and the service runs without public subsidy, operated by a company that identified the absence of any direct daytime train across three of Scandinavia's largest cities as a gap worth filling.",
      src:  "Good News Network / Snälltåget",
      url:  "https://www.goodnewsnetwork.org/swedens-breathtaking-new-train-ride-to-oslo-passes-by-best-of-countrys-landscape/",
      img:  "https://images.unsplash.com/photo-9xhu1BA1RqA?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
