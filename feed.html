<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 459 · Tue, June 2, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Wednesday, June 3, 2026",
  edition: 460,
  stories: [
    {
      cat: "Nature",
      place: "East Somerset, England",
      head: "A 460-acre former dairy farm in Somerset recorded 27 new bird species and more than doubled its butterfly count in three years — after intensive grazing ended and the land was simply left alone.",
      dek:  "Heal Rewilding published the inaugural State of Nature report for its Heal Somerset site on 2 June 2026, counting butterfly species risen from 11 to 24, bird species from 67 to 94, and small mammal populations 188 percent more abundant than on a neighbouring organic farm — with no trees planted and no animals reintroduced. The charity acquired the 460-acre former dairy farm in December 2022, stopped intensive cattle grazing, and waited; 35 surveys conducted over three years found 404 invertebrate species, 15 bat species, and 60 breeding bird species — including 21 on the UK's red list for conservation concern. Heal Rewilding says the results support a low-cost, passive model of nature recovery that could be applied to the many farms across the UK now exiting agricultural subsidy programmes, where the only active step required is to stop.",
      src:  "Heal Rewilding / Pressat / EnviroLink Network",
      url:  "https://pressat.co.uk/releases/heal-somerset-publishes-first-ever-state-of-nature-report-focusing-solely-on-rewilding-5ab719603c9651afe790b0b66b3b3864/",
      img:  "https://images.unsplash.com/photo-1500485329006-54f89e8e4af1?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Small Wonders",
      place: "Patagonia, Argentina",
      head: "A newly named dinosaur from Patagonia had the hooked claws of a raptor and the neck of a heron — the first theropod ever described as a fish-hunter from the water's edge.",
      dek:  "Palaeontologists at the Museo Argentino de Ciencias Naturales in Buenos Aires formally described Kank australis, a 70-million-year-old unenlagiid theropod roughly two to three metres long, whose fossilised neck vertebrae match the rapid-strike anatomy that allows modern herons to spear fish — strongly suggesting it waded Patagonian shallows and plunged for prey with the same motion. The key neck bone was found in 2024 near El Calafate, completing a skeleton first started in 2018, and the team's analysis in the Journal of Vertebrate Palaeontology classifies Kank australis as piscivorous — the first demonstration of fish-hunting in the unenlagiine lineage. The study calls it convergent evolution: nature arriving independently at the same solution, 70 million years apart, in bodies built for very different lives.",
      src:  "Museo Argentino de Ciencias Naturales / Journal of Vertebrate Palaeontology / ScienceDaily",
      url:  "https://www.sciencedaily.com/releases/2026/05/260529043636.htm",
      img:  "https://images.unsplash.com/photo-1531761535209-180857e963b9?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Everyday Joy",
      place: "Darling Harbour, Sydney, Australia",
      head: "A 21-year-old music student stepped from the audience onto a Sydney stage and completed an orchestral concert after the featured pianist fell ill mid-performance.",
      dek:  "During a live performance of the La La Land film score at Darling Harbour Theatre on 1 June 2026, the concert pianist became unwell mid-show; conductor Justin Hurwitz — who wrote the film's Oscar-winning score — asked the 2,500-person audience whether any trained sight-reading pianist was present, and Sterling Nasa, a bagpipe tutor who had also studied piano, raised his hand. After two to three minutes in the wings with the score, Nasa performed the remainder of the concert — including a technically demanding synthesiser-like solo — without rehearsal and to a standing ovation. Hurwitz said his mind was \"spinning\" at the outcome and described it as one of the stranger and more wonderful evenings he could remember.",
      src:  "CNN / Darling Harbour Theatre, Sydney",
      url:  "https://www.cnn.com/2026/06/01/entertainment/la-la-land-concert-sydney-scli-intl",
      img:  "https://images.unsplash.com/photo-1514320291840-2e0a9bf2a9ae?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Vernon, British Columbia, Canada",
      head: "Volunteer pilots in Vernon, British Columbia have begun their eighth season of free trishaw rides for seniors — 2,700 rides and 22,000 kilometres into a project started in 2019.",
      dek:  "The Cycling Without Age chapter in Greater Vernon sends its volunteers on three-wheeled cargo bikes with passenger seats through Polson Park and the Okanagan Rail Trail, carrying seniors and people with limited mobility at a pace slow enough for conversation and spontaneous stops, at no charge. The chapter reported the start of its eighth season on 31 May 2026, with rides running through October, and is recruiting new volunteer pilots to extend the service across the city. Drawing on a Danish model now in more than 50 countries, Vernon's tally of 2,700 rides over seven years shows what a simple idea can do when the main ingredient is unhurried time.",
      src:  "Vernon Morning Star / Cycling Without Age Canada",
      url:  "https://vernonmorningstar.com/2026/05/31/cycling-without-age-wheels-into-year-8-in-greater-vernon/",
      img:  "https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "Icahn School of Medicine at Mount Sinai, New York",
      head: "A manufactured cocktail of 15 gut bacterial strains matched fecal transplants for the first time in a controlled trial — pointing toward a standardised treatment for a dangerous gut infection.",
      dek:  "In an 18-patient Phase 1b randomised trial published in Nature Medicine on 2 June 2026, researchers at Icahn School of Medicine at Mount Sinai found that a precisely selected mix of 15 cultured bacterial strains performed comparably to donor fecal microbiota transplant in clearing recurrent Clostridioides difficile infection — a gut pathogen that kills tens of thousands each year and resists most antibiotics after the first recurrence. The 15-strain cocktail was grown in a custom anaerobic GMP chamber, making it pathogen-screened and reproducible unlike donor material, and all treated patients showed durable bacterial engraftment in follow-up sampling. An oral formulation is now in development, which would make the therapy scalable and far more accessible than the current procedure.",
      src:  "Icahn School of Medicine at Mount Sinai / Nature Medicine",
      url:  "https://medicalxpress.com/news/2026-06-gut-bacteria-fecal-transplants-small.html",
      img:  "https://images.unsplash.com/photo-1576086213369-97a306d36557?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "Turks and Caicos Islands, Caribbean",
      head: "The Turks and Caicos Islands have become the first territory in the Americas to eliminate mother-to-child transmission of hepatitis B, certified by the WHO on June 3.",
      dek:  "The Pan American Health Organization confirmed on 3 June 2026 that the Turks and Caicos Islands had met WHO thresholds for eliminating mother-to-child transmission of both HIV and hepatitis B: HIV transmission rates are below 2 percent, fewer than 5 new paediatric infections occur per 1,000 live births, and more than 90 percent of newborns receive the hepatitis B birth dose within 24 hours. The archipelago is the first territory in the Americas to validate the hepatitis B milestone specifically, earned through antenatal care coverage above 95 percent and multilingual outreach to mobile and migrant communities. The certification advances a regional PAHO goal known as triple elimination — clearing maternal transmission of HIV, syphilis, and hepatitis B across the Caribbean and Latin America.",
      src:  "PAHO/WHO",
      url:  "https://www.paho.org/en/news/3-6-2026-who-certifies-turks-and-caicos-eliminating-mother-child-transmission-hiv-and",
      img:  "https://images.unsplash.com/photo-1510414842594-a61c69b5ae57?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
