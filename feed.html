<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 461 · Thu, June 4, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Thursday, June 4, 2026",
  edition: 461,
  stories: [
    {
      cat: "Nature",
      place: "Matusadona, Zimbabwe",
      head: "Critically endangered black rhinos have returned to Zimbabwe's Matusadona National Park — for the first time in thirty years — as Zimbabwe's national count crosses 1,000 rhinos for the first time since the early 1990s.",
      dek:  "Critically endangered black rhinos were reintroduced to the shores of Lake Kariba at Matusadona National Park on June 3, returning to a landscape from which poaching had eliminated every last rhino by the early 1990s — the animals are direct descendants of individuals rescued from the Sebungwe region in the late 1980s before the local population collapsed entirely. The reintroduction, led by Zimbabwe Parks and Wildlife Management Authority and African Parks, releases the animals in phases into a new 175-square-kilometre Intensive Protection Zone where rangers will monitor each individual as the population establishes. Zimbabwe's national count now stands at 1,033 rhinos — 616 black and 417 white — the first time the country has recorded more than 1,000 in over three decades, built through sustained anti-poaching patrols, community partnerships, and coordinated breeding across its network of reserves.",
      src:  "Newsday Zimbabwe / African Parks / News24",
      url:  "https://www.newsday.co.zw/local-news/article/200056407/after-three-decades-black-rhino-return-to-zimbabwes-matusadona",
      img:  "https://images.unsplash.com/photo-1474511320723-9a56873867b5?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "Chinese University of Hong Kong",
      head: "Gut bacteria present in a baby's first year can neutralise an inherited risk of autism spectrum disorder and ADHD, a study tracking infants from birth to age three finds.",
      dek:  "Researchers at The Chinese University of Hong Kong tracked infants from birth to age three, mapping both their epigenetic risk profile for autism spectrum disorder and ADHD and the gut bacteria that colonised them in their first year — finding that certain strains, including Lachnospira, can substantially offset inherited neurodevelopmental risk regardless of genetic loading. The study, published in June 2026, showed that epigenetic patterns set at birth shape which microbes take root, but that the microbiome can then modulate the effect of those patterns on early brain development, shifting measurable outcomes. A trial of live biotherapeutics targeted at the identified protective strains is now being designed, with the goal of delivering the intervention as a probiotic supplement in the first weeks of life.",
      src:  "ScienceDaily / Technology Networks / Chinese University of Hong Kong",
      url:  "https://www.sciencedaily.com/releases/2026/06/260602021645.htm",
      img:  "https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Everyday Joy",
      place: "Heian Jingu, Kyoto, Japan",
      head: "Kyoto's Heian Shrine has marked 75 years of Takigi Noh — a tradition of performing Japan's 600-year-old masked theatre by bonfire light, begun in 1950 to return Noh to the open air.",
      dek:  "On 1 and 2 June 2026, Heian Jingu lit its ceremonial bonfires — kagaribi — for the 75th consecutive Takigi Noh, as three classical schools performed masked Noh and comedic Kyogen pieces before the shrine's illuminated vermilion gate; the programme also marked 130 years since the shrine's founding in 1895. Tickets sell out weeks in advance, and rain sends audiences to a nearby concert hall — a contingency that has itself become part of the tradition across three-quarters of a century. Takigi Noh was revived here in 1950 specifically to open a theatre form that had retreated almost entirely into private aristocratic patronage, and the fact that it has held for 75 years is the quiet proof that the idea was right.",
      src:  "MatsuriMap / Discover Kyoto",
      url:  "https://www.discoverkyoto.com/event-calendar/june/takigi-noh-heian-shrine/",
      img:  "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "South Korea",
      head: "South Korea opened walk-in welfare stations where anyone may collect meals and essentials without an eligibility check — 107 pilot sites have expanded across 67 cities, en route to 300 by year's end.",
      dek:  "South Korea's Ministry of Health and Welfare launched the \"Just Give Center\" programme — walk-in stations where anyone may collect up to 20,000 won in ready-made meals and daily necessities without proving income, residency, or eligibility — across 107 sites in 67 cities and counties during a two-month pilot. The government has committed 12.9 billion won to expand the network to roughly 300 locations by the end of 2026; during the pilot, around 200 people without resident registration or formal documentation — who could not navigate standard welfare paperwork — were connected onward to longer-term support services. The programme rests on the finding that means-testing routinely fails the people who need help most, and removes the test entirely.",
      src:  "Korea Herald / Ministry of Health and Welfare, South Korea",
      url:  "https://www.koreaherald.com/article/10670556",
      img:  "https://images.unsplash.com/photo-1556900703-bb1021fde498?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Small Wonders",
      place: "Madagascar",
      head: "Four new records of a shark endemic to Madagascar have surfaced after twenty years of scientific silence — the blue-spotted bamboo shark, first described in 1914, rediscovered through fish-market surveys.",
      dek:  "Researchers from the Madagascar Whale Shark Project confirmed four records of Chiloscyllium caeruleopunctatum — the blue-spotted bamboo shark — through surveys of fish markets and a university specimen collection along Madagascar's coast, ending a gap of nearly twenty years since a single photograph in 2006; the findings were published in the journal Oryx on June 4. The small, spotted shark was first formally described from a Madagascar specimen in 1914; lead author Tsarahasina Fanomezana says it has likely been misidentified in catch data for decades and effectively omitted from the island's conservation map. The rediscovery strengthens the case for systematic surveys of Madagascar's coastal fish markets, where dozens of shark species pass through with little scientific scrutiny.",
      src:  "Madagascar Whale Shark Project / Oryx / Mongabay",
      url:  "https://news.mongabay.com/short-article/2026/06/new-records-of-lost-bamboo-shark-confirmed-in-madagascar/",
      img:  "https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "Egypt",
      head: "Egypt has been certified free of trachoma by the WHO — the 30th country globally to eliminate the leading infectious cause of blindness — after driving infection below threshold in all 27 of its governorates.",
      dek:  "WHO Director-General Tedros Adhanom Ghebreyesus presented Egypt's trachoma elimination certificate at the 79th World Health Assembly in Geneva on May 21, confirming that active trachoma prevalence among children aged 1 to 9 had been driven below 5 percent across all 27 of Egypt's governorates — a standard reached through decades of mass antibiotic distribution, facial hygiene campaigns, and improved access to clean water in thousands of rural communities. Egypt becomes the 7th country in the Eastern Mediterranean region and the 30th globally to reach the milestone. The certification also makes Egypt the first African country to hold WHO-validated elimination of five diseases: polio, measles, rubella, malaria, and trachoma.",
      src:  "Daily News Egypt / Ahram Online / WHO",
      url:  "https://www.dailynewsegypt.com/2026/05/19/egypt-certified-by-who-as-free-of-trachoma/",
      img:  "https://images.unsplash.com/photo-1553913861-c0fddf2619ee?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
