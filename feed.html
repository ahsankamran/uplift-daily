<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
  overflow: hidden;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }

/* Mobile — prevent content overflowing into top chrome */
@media (max-width: 600px) {
  .card-inner {
    padding: 64px 20px 80px;
  }
  .headline {
    font-size: clamp(22px, 5vw, 32px);
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    overflow: hidden;
    font-size: 14px;
  }
  .cover-wordmark {
    font-size: clamp(40px, 12vw, 72px);
  }
  .bottom {
    padding: 14px 18px 20px;
  }
}
@media (max-height: 700px) {
  .card-inner {
    padding-top: 56px;
    padding-bottom: 72px;
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
  }
}
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 512 · Fri, August 7, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Saturday, August 8, 2026",
  edition: 513,
  stories: [
    {
      cat: "Nature",
      place: "Ile-Balkhash Nature Reserve, Kazakhstan",
      head: "Kazakhstan released a tiger into the wild for the first time in more than 70 years.",
      dek:  "On July 31, wildlife officials released a female Amur tiger named Ümit, Kazakh for \"hope,\" into the Ile-Balkhash State Nature Reserve in the country's southeast, ending a 70-year absence since the native Caspian tiger disappeared. The reserve spent a decade rebuilding the ecosystem first, restoring populations of Bukhara deer, saiga antelope and kulan before officials brought in four tigers from Russia's Khabarovsk region this past May. Ümit now roams freely wearing a satellite collar, while the other three, including two cubs, remain in large adaptation enclosures and are expected to join her within the reserve in the coming years.",
      src:  "Astana Times",
      url:  "https://astanatimes.com/2026/08/kazakhstan-releases-first-tiger-into-wild-in-more-than-70-years/",
      img:  "https://images.unsplash.com/photo-1730014392621-10de7b9bc20f?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "Southampton, England",
      head: "A vaccine that needs no refrigeration passed its first human trial.",
      dek:  "Researchers at the University of Southampton tested SPVX02, a tetanus-diphtheria booster that stays potent for at least two years at temperatures up to 30°C, in 60 healthy adults. By day 28, every participant who received it had reached protective antibody levels matching those from standard refrigerated vaccines, with only mild, expected side effects such as soreness and headache. Because roughly half the world's vaccines are wasted to breaks in the cold chain, developers hope a larger phase 2b trial will bring the shot closer to use in places without reliable refrigeration.",
      src:  "University Hospital Southampton",
      url:  "https://www.uhs.nhs.uk/whats-new/press-releases/fridge-free-vaccine-shows-promise-for-reaching-millions-more-people-worldwide",
      img:  "https://images.unsplash.com/photo-1608422050828-485141c98429?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "Gökova Bay, Turkey",
      head: "Local fishers and rangers tripled Turkey's protected coastal waters.",
      dek:  "Conservationists led by Zafer Kızılkaya worked with fishing communities along 310 miles of Turkey's Mediterranean coast to create or expand 18 no-fishing zones between 2019 and 2023, tripling the country's total protected seascapes. The Mediterranean Conservation Society trained local marine rangers to patrol the zones, and illegal fishing inside them has since dropped by 80 percent while more than 30 Mediterranean monk seals have returned to the area. Fishers working just outside the reserves report bigger catches too, a result organizers now use to bring skeptical neighboring villages on board.",
      src:  "Good News Network",
      url:  "https://www.goodnewsnetwork.org/locals-succeed-in-tripling-protected-seascapes-along-300-miles-of-turkiyes-breathtaking-coastline/",
      img:  "https://images.unsplash.com/photo-1757540458718-39b554788b44?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Zakariyapura, Gujarat, India",
      head: "One woman's idea now turns cow dung into cooking fuel for 368 households.",
      dek:  "After visiting a biogas plant in a neighboring village, Madhuben helped bring the technology to Zakariyapura, where cattle-owning families now convert dung and water into cooking gas at home. The project, backed by the National Dairy Development Board, grew into what organizers call the country's first all-women biogas cooperative, with members earning 3,000 to 5,000 rupees a month selling the leftover slurry as fertilizer. Households have cut spending on firewood and gas cylinders, kitchen smoke has dropped, and girls have more time for school now that gathering fuel takes less of the day.",
      src:  "The Better India",
      url:  "https://thebetterindia.com/sustainability/zakariyapura-biogas-cattle-dung-village-women-livelihoods-gujarat-12239846",
      img:  "https://images.unsplash.com/photo-1530507629858-e4977d30e9e0?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Small Wonders",
      place: "Tasmania, Australia",
      head: "A thumb-sized fish that walks instead of swims became a photography milestone.",
      dek:  "A red handfish, one of fewer than 250 left in the wild off Tasmania's southeast coast, became the 18,000th species photographed for National Geographic's Photo Ark. Photographer Joel Sartore captured the critically endangered fish at the University of Tasmania's marine institute, where researchers run a captive breeding program; rather than swim, it walks across the seafloor on modified fins. The milestone falls in the Photo Ark's 20th anniversary year, a project Sartore started to win affection for species too small or strange to otherwise get noticed.",
      src:  "Australian Photography",
      url:  "https://www.australianphotography.com/news/critically-endangered-tasmanian-fish-becomes-18-000th-species-photographed-for-nat-geo-photo-ark",
      img:  "https://images.unsplash.com/photo-1760556415132-533affdd9ccf?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Everyday Joy",
      place: "Heather, Leicestershire, England",
      head: "A Leicestershire village has covered itself in scarecrows every August for 28 years.",
      dek:  "The Heather Scarecrow Festival returned to the small village of Heather for its 28th year, with homes, schools and shopfronts building scarecrow displays across the village from August 2 to 8. The entirely volunteer-run event, founded by Di Everett, sells £3 trail guides to visitors and raised more than £9,000 for local groups last year; the reigning champion entry was titled <em>Ratacrowie</em>. In 2025 the festival won the King's Award for Voluntary Service, the volunteer equivalent of an MBE, and thousands still turn up each summer to see what the village has built.",
      src:  "Ashby Nub News",
      url:  "https://ashby.nub.news/news/local-news/award-winning-scarecrow-competition-back-for-2026-303751",
      img:  "https://images.unsplash.com/photo-1760359505336-87b5754262f4?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
