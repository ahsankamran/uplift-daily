<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 444 · Tue, May 19, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Tuesday, May 19, 2026",
  edition: 444,
  stories: [
    {
      cat: "Nature",
      place: "Global / Colombia",
      head: "On Global Big Day 2026, birders across 203 countries recorded 8,023 species in a single day — the first time the annual tally has broken the 8,000-species threshold.",
      dek:  "On 9 May 2026, 80,000 volunteer birders submitted 4.1 million observations to Cornell Lab of Ornithology's eBird platform, documenting 8,023 bird species in a single day — the first time the annual Global Big Day count has exceeded 8,000, with results published on 13 May. Colombia led all nations for the fifth consecutive year, with 4,352 observers recording 1,566 species — roughly 40 percent of all bird species known to inhabit the country, found in a single day. The dataset, the largest single-day scientific record of avian biodiversity ever assembled, will help ornithologists map range shifts and early indicators of population change across six continents.",
      src:  "Cornell Lab of Ornithology / eBird",
      url:  "https://ebird.org/news/global-big-day-2026-results",
      img:  "https://images.unsplash.com/photo-1444464666168-49d633b86797?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Edinburgh, Scotland",
      head: "Edinburgh's library service gifted 150 prisoners hand-wrapped books in a Secret Santa scheme that cost £20 and helped earn the city's libraries the UK's Library of the Year award.",
      dek:  "Staff at Oxgangs Library and those working inside HMP Edinburgh ran a book Secret Santa: prisoners named a favourite genre, librarians selected books from existing stock, wrapped them with handmade bookmarks, and a 'Library Elf' delivered them to 150 participants — roughly 15 percent of the prison population, many first-time library users — at a total packaging cost of £20. The City of Edinburgh Council Library Service was named overall Library of the Year at the 2026 British Book Awards on 11 May, beating 46 finalists from across the UK and Ireland, with judges citing the prison scheme as a model for combating loneliness through reading.",
      src:  "The Reading Agency / British Book Awards",
      url:  "https://readingagency.org.uk/city-of-edinburgh-council-library-service-wins-overall-library-of-the-year-award-for-initiative-which-helped-combat-loneliness-in-prisons-with-books/",
      img:  "https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "St. Louis, USA",
      head: "Thirty adults with high-risk blood cancer received CRISPR-edited stem cell transplants in the first human trial to safely combine gene editing with antibody therapy — and all thirty achieved full engraftment.",
      dek:  "A phase 1/2 trial published in Nature Medicine on 12 May 2026, led by Washington University in St. Louis across 15 North American sites, enrolled 30 adults with acute myeloid leukaemia or myelodysplastic syndrome and gave each a stem cell transplant from which CRISPR editing had removed the CD33 protein — the same target used by an antibody-drug that would otherwise destroy donor cells. All 30 patients achieved full engraftment by day 28 and maintained healthy blood counts through subsequent antibody maintenance rounds, resolving a treatment conflict that had previously made the combination impossible. In a linked case study, a patient who then received CD33-directed CAR T-cell therapy achieved complete remission and remained cancer-free at one year.",
      src:  "Nature Medicine / WashU Medicine",
      url:  "https://source.washu.edu/2026/05/gene-edited-stem-cell-transplant-shows-promise-for-aggressive-blood-cancers/",
      img:  "https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Small Wonders",
      place: "Papua New Guinea / Global",
      head: "Zoos on four continents competed to film tree kangaroos crunching loudly — and a week of videos drew millions of views while raising awareness of a rain-forest marsupial under pressure.",
      dek:  "From 11 to 17 May 2026, zoos and wildlife centres across the Americas, Europe, Asia, and Oceania posted short videos of tree kangaroos vigorously crunching food as part of the International Tree Kangaroo Crunch-a-Thon, timed ahead of World Tree Kangaroo Day on 21 May. The campaign, organised by AZA's SAFE: Tree Kangaroo programme — which supports community-led conservation in Papua New Guinea's Huon Peninsula forests — reached millions of viewers and competed across categories including Most Likes and Judges' Choice. Fourteen species of tree kangaroo live in the rain forests of Papua New Guinea and Queensland, most under pressure from logging and hunting, and the programme links zoo fundraising directly to in-situ forest-corridor work in New Guinea.",
      src:  "AZA SAFE Tree Kangaroo / Popular Science",
      url:  "https://www.popsci.com/environment/animals-2026-crunch-a-thon/",
      img:  "https://images.unsplash.com/photo-1425082661705-1834bfd09dca?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Everyday Joy",
      place: "Czech Republic / Denmark",
      head: "A daily direct train between Prague and Copenhagen runs again for the first time in over a decade, crossing four countries through central Europe's finest landscapes in twelve hours.",
      dek:  "On 1 May 2026, Czech Railways, Deutsche Bahn, and Denmark's DSB jointly relaunched a direct service from Prague to Copenhagen via Dresden, Berlin, and Hamburg — a corridor that had been severed for more than ten years. Two departures run year-round, with a third added through summer, carrying passengers across four countries and through the Elbe valley, the north German lowlands, and the Danish coast without changing trains. Bookings for the first weeks of service sold out within days of going on sale, with operators calling the restored route a practical alternative to flying on one of central Europe's most scenic long-distance journeys.",
      src:  "Euronews Travel / RailTech.com",
      url:  "https://www.euronews.com/travel/2026/05/01/direct-prague-to-copenhagen-train-returns-after-more-than-a-decade",
      img:  "https://images.unsplash.com/photo-1474487548417-781cb6d646b3?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "Portugal & UAE",
      head: "The World Health Organization formally recognised Portugal and the United Arab Emirates for eliminating industrially produced trans fats — a dietary change estimated to prevent hundreds of thousands of deaths each year.",
      dek:  "At the 79th World Health Assembly in Geneva on 19 May 2026, WHO Director-General Tedros Adhanom Ghebreyesus formally validated Portugal and the United Arab Emirates for eliminating industrially produced trans fatty acids from their food supplies under the REPLACE trans fat elimination programme. Trans fats, formed when vegetable oils are partially hydrogenated for food processing, are estimated to cause more than 500,000 cardiovascular deaths globally each year; both countries achieved elimination through mandatory limits on trans fat content in all processed foods. The two countries join a growing list of nations that have met WHO's threshold, as the organisation advances its target of global trans fat elimination by 2030.",
      src:  "WHO / World Health Assembly, Geneva",
      url:  "https://www.who.int/news-room/speeches/item/who-director-general-s-address-to-member-states-at-the-79th-world-health-assembly---19-may-2026",
      img:  "https://images.unsplash.com/photo-1490818387583-1baba5e638af?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
