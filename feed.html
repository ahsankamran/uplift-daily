<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
  overflow: hidden;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }

/* Mobile — prevent content overflowing into top chrome */
@media (max-width: 600px) {
  .card-inner {
    padding: 64px 20px 80px;
  }
  .headline {
    font-size: clamp(22px, 5vw, 32px);
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    overflow: hidden;
    font-size: 14px;
  }
  .cover-wordmark {
    font-size: clamp(40px, 12vw, 72px);
  }
  .bottom {
    padding: 14px 18px 20px;
  }
}
@media (max-height: 700px) {
  .card-inner {
    padding-top: 56px;
    padding-bottom: 72px;
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
  }
}
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 519 · Wed, August 19, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Thursday, August 20, 2026",
  edition: 520,
  stories: [
    {
      cat: "Nature",
      place: "Jantho, Aceh, Indonesia",
      head: "A once-trafficked orangutan gave birth in the wild forest where she was reintroduced seven years ago.",
      dek:  "Bulan, a Sumatran orangutan rescued from wildlife traffickers and released into Sumatra's Jantho Nature Reserve seven years ago, has given birth to a healthy male infant named Badar. It is the tenth confirmed birth among reintroduced orangutans at Jantho since the rehabilitation program began fifteen years ago, according to the Lestari Ecosystem Foundation's M. Yakob Ishadamy. Fewer than 11,700 Sumatran orangutans remain in the wild, so conservationists say each birth in the wild is evidence that protected habitat, not just rescue, is what lets the species rebuild.",
      src:  "Mongabay",
      url:  "https://news.mongabay.com/2026/08/rescued-from-traffickers-reintroduced-orangutan-becomes-mother-in-the-wild/",
      img:  "https://images.unsplash.com/photo-1771968100091-d69cc0feee15?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Boise, Idaho",
      head: "Eight teenagers turned their viral summer account into a mission to clean up their hometown river.",
      dek:  "Eight friends in Idaho's Treasure Valley grew an Instagram account called 208 Boys past their original goal of 10,000 followers to nearly 200,000 by documenting summer dives in the Boise River, and started hauling out what they found underwater. \"There was a lot of cans and cases of beer — it's pretty upsetting to see,\" said member Austin Drake, and the group now posts each cleanup alongside their usual videos. What began as a bid for followers has become a running, self-organized cleanup crew, with the friends returning to the river through the rest of the summer and asking their audience to pitch in too.",
      src:  "Sunny Skyz",
      url:  "https://www.sunnyskyz.com/good-news/6284/8-Idaho-Teens-Turn-Their-Viral-Summer-Account-Into-a-Mission-to-Clean-Up-the-Boise-River",
      img:  "https://images.unsplash.com/photo-1758599669317-efd787d954ef?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "Heidelberg, Germany",
      head: "A single infusion of engineered immune cells cleared a teenager's metastatic kidney cancer.",
      dek:  "Doctors at the Hopp Children's Cancer Center in Heidelberg gave a 17-year-old boy, whose kidney cancer had spread to his liver, lungs and brain after a decade of relapses, a single infusion of his own T cells engineered to target the PRAME protein on his tumor. Led by Christian Seitz with lab work from Patrick Schmidt's team at the German Cancer Research Center, the cells were manufactured in seven days and left no detectable tumor within three months; nearly a year later, he is back to competitive cycling. The Dietmar Hopp Foundation is now funding a 1.8-million-euro trial testing the approach in up to 18 children with PRAME-positive solid tumors, starting in 2027.",
      src:  "German Cancer Research Center",
      url:  "https://www.dkfz.de/en/news/press-releases/detail/prame-specific-t-cell-therapy-in-an-adolescent-with-metastatic-kidney-tumor",
      img:  "https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Small Wonders",
      place: "Queensland, Australia",
      head: "A mother dolphin was filmed teaching her calf to hunt fish with a seashell.",
      dek:  "Researchers in Queensland's Great Sandy Marine Park filmed a bottlenose dolphin calf learning to hunt with a tool: chasing fish into a large snail shell, then lifting it above the water to shake the catch into its mouth. University of the Sunshine Coast researcher Alexis Levengood says the behavior, called \"shelling\" and first documented in Western Australia in 2011, appears to have been independently invented by this separate, non-migrating population. The sighting adds to evidence that dolphins pass specialized foraging skills down from mother to calf, much like the traditions seen in orcas and chimpanzees.",
      src:  "Mongabay",
      url:  "https://news.mongabay.com/2026/08/dolphin-mother-and-calf-observed-using-shells-to-catch-fish-in-australia/",
      img:  "https://images.unsplash.com/photo-1514125989062-f7531e2bece3?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Everyday Joy",
      place: "Yeongdeok, South Korea",
      head: "A century-old market street in South Korea is recreating exactly how it looked a hundred years ago.",
      dek:  "From August 21 to 23, Yeongdeok's Yeonghae Market Street — one of only six village-level sites in South Korea with national heritage status — turns into \"Yeonghae 1926,\" a nightly recreation of the town as it looked a century ago. Across forty programs staged from 7 to 11 p.m., visitors can ride rickshaws, watch silent films, wear 1920s dress and make lanterns, alongside a period costume parade, a traveling circus act, a cabaret show, and traditional circle dancing and onggi pottery-making. Organizers built the festival entirely around the market street's own preserved history, betting that an ordinary town's past is reason enough for a celebration.",
      src:  "Kyunghyang Shinmun",
      url:  "https://www.khan.co.kr/en/article/202608161423017/",
      img:  "https://images.unsplash.com/photo-1510673465470-18515a7168e2?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "Otago, New Zealand",
      head: "New Zealand opened five marine reserves co-governed by the Māori tribe Kāi Tahu for the first time in the country's history.",
      dek:  "On July 1, New Zealand's Department of Conservation and the Kāi Tahu tribe opened five marine protected areas covering 308 square kilometers of the South Island's southeast coast. A joint ranger team gives Kāi Tahu, whose network was championed by leaders including Edward Ellison, shared decision-making authority alongside government conservators, backed by seven million New Zealand dollars and six new full-time ranger positions through 2027. The model, a decade in the planning, is now being offered as a blueprint for other Indigenous-led marine protection efforts around the country.",
      src:  "Mongabay",
      url:  "https://news.mongabay.com/2026/08/new-zealand-opens-marine-reserves-with-groundbreaking-maori-co-management-model/",
      img:  "https://images.unsplash.com/photo-1782833181537-de8195d915f7?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
