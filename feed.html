<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
  overflow: hidden;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }

/* Mobile — prevent content overflowing into top chrome */
@media (max-width: 600px) {
  .card-inner {
    padding: 64px 20px 80px;
  }
  .headline {
    font-size: clamp(22px, 5vw, 32px);
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    overflow: hidden;
    font-size: 14px;
  }
  .cover-wordmark {
    font-size: clamp(40px, 12vw, 72px);
  }
  .bottom {
    padding: 14px 18px 20px;
  }
}
@media (max-height: 700px) {
  .card-inner {
    padding-top: 56px;
    padding-bottom: 72px;
  }
  .dek {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
  }
}
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 471 · Sun, June 14, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Monday, June 15, 2026",
  edition: 472,
  stories: [
    {
      cat: "Nature",
      place: "Ulong Island, Palau",
      head: "Rat removal from a single Palau island sent seabird calls up 286 percent within one year — and the coral reef below is already recovering.",
      dek:  "When invasive rats were eradicated from Ulong Island in western Palau, researchers expected recovery measured in decades — instead, bridled tern calls rose 286 percent within twelve months, and fish biomass at the strongest-responding reef location increased 183 percent as seabird nutrients began flowing into the water. Scientists from Scripps Institution of Oceanography and Island Conservation, publishing the first experimental evidence linking seabird recovery to coral reef productivity, found that leaf nitrogen at one monitoring site rose roughly 80 percent as droppings fertilised the forest's nutrient cycle. The results offer a replicable model for the more than 1,400 rat-invaded islands across the Pacific, where similar eradications could trigger cascading land-to-sea recovery at a fraction of the cost of direct reef restoration.",
      src:  "Mongabay",
      url:  "https://news.mongabay.com/short-article/2026/06/researchers-find-dramatic-restoration-on-land-and-sea-after-island-rat-removal/",
      img:  "https://images.unsplash.com/photo-1559827260-dc66d52bef19?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "South Africa",
      head: "South Africa has begun distributing lenacapavir — a twice-yearly injection proven nearly 100 percent effective against HIV — at 360 public clinics across six provinces.",
      dek:  "On June 5, the government launched the drug at 360 public health facilities in 24 high-burden districts, funded by a $29 million Global Fund grant; the country carries the world's largest HIV burden, with more than 8 million people living with the virus and 140,000 to 170,000 new infections occurring each year. The drug costs $40 per person annually under generic pricing agreements — down from a list price of $28,000 — and showed 100 percent effectiveness in the Johannesburg-based PURPOSE trials that prompted the rollout. The government aims to reach three million South Africans with the injection over three years, making this the largest public rollout of a new HIV prevention tool since antiretrovirals entered mass use.",
      src:  "ABC News / AP",
      url:  "https://abcnews.go.com/International/wireStory/highly-effective-prevention-drug-arrives-south-africa-worlds-133703721",
      img:  "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "London, UK",
      head: "A pooled analysis of two decade-long trials finds that people who reversed prediabetes cut their risk of cardiovascular death or heart failure by 58 percent.",
      dek:  "Researchers at King's College London and University Hospital Tübingen combined data from 2,402 participants in the US Diabetes Prevention Program Outcomes Study and China's DaQing Diabetes Prevention Outcomes Study, finding that those who normalised blood glucose through lifestyle changes had a 58 percent lower risk of dying from heart disease or being hospitalised for heart failure. The same group saw a 42 percent reduction in heart attack, stroke, and other major cardiovascular events over more than two decades, with the protective effect holding even among participants who later redeveloped elevated blood sugar. The findings, published in The Lancet Diabetes & Endocrinology, reframe prediabetes reversal as a direct route to heart protection for the estimated one billion people worldwide currently living with the condition.",
      src:  "ScienceDaily / The Lancet Diabetes & Endocrinology",
      url:  "https://www.sciencedaily.com/releases/2026/06/260613034237.htm",
      img:  "https://images.unsplash.com/photo-1498837167922-ddd27525d352?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Small Wonders",
      place: "Oaxaca, Mexico",
      head: "The Mexican long-tongued bat extends an eight-centimetre tongue to drink agave nectar — and without it neither wild agave nor artisanal mezcal could survive.",
      dek:  "Each night across Mexico's agave highlands, Mexican long-tongued bats plunge tongues nearly eight centimetres long — fringed with hair-like papillae — deep into agave flowers, dusting themselves with pollen that fertilises the next plant they visit; the bats are the primary pollinators of wild agave, the plant at the heart of tequila and mezcal. Mezcal production has surged more than 700 percent in the past decade, shrinking the wild agave stands the bats depend on for raising their young, but some producers in Oaxaca's Matatlán valley now reserve 30 percent of their plants unharvested so the animals can feed through the flowering season. A Mongabay photo essay published today documents the relationship in close-up detail, placing the bat's improbable tongue — and the two-way dependency it anchors — in front of a global audience.",
      src:  "Mongabay",
      url:  "https://news.mongabay.com/short-article/2026/06/the-bats-that-pollinate-for-tequila-photo-of-the-week/",
      img:  "https://images.unsplash.com/photo-1545696968-1a31ea033ca2?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Everyday Joy",
      place: "Willaston, Cheshire, England",
      head: "Willaston held its 47th World Worm Charming Championships on June 13, with competitors stomping, patting, and playing music to coax earthworms from three-metre plots.",
      dek:  "At Willaston Primary Academy in Cheshire, participants were assigned a three-by-three-metre plot and given thirty minutes to lure earthworms to the surface using only vibration — no digging permitted — with this year's winners, grandfather Peter Clarke and grandchildren Sienna Beavers and Archie Clarke of Plot 60, charming 164 worms to the surface. The competition was born in 1980 as a school fundraiser; entry fees of £5 to £15 still go to the school association, all worms are released unharmed after counting, and the all-time record of 567 — set by Tom Shufflebotham on the very first day — still stands after 47 years. The event now draws visitors from more than a dozen countries each June, with spectators travelling from as far as Japan and the United States to watch competitors out-vibrate each other in a Cheshire school field.",
      src:  "The Nantwich News",
      url:  "https://thenantwichnews.co.uk/2026/06/14/global-spotlight-falls-on-willaston-worm-charming-spectacle/",
      img:  "https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Kelowna, British Columbia, Canada",
      head: "After a crash on a rural British Columbia highway sent her dog into the wilderness, a community of volunteers spent 96 hours finding her.",
      dek:  "When Dearah Jordan's vehicle was struck and rolled on a rural BC highway, her Australian shepherd Daisy bolted into the surrounding wilderness; within hours, volunteers arrived with thermal-imaging drones, satellite communication links, and supplies for a four-day search across remote Central Okanagan terrain — \"complete strangers coming out of the woodworks,\" Jordan said. Forrest Kellerman of Central Okanagan Search and Rescue led the effort with his wife Tracey, who eventually found Daisy sitting calmly on the passenger seat of the vehicle that had caused the crash, four days after the dog first disappeared. Jordan was discharged from hospital the day of the accident and is recovering; Daisy was uninjured.",
      src:  "Good News Network",
      url:  "https://www.goodnewsnetwork.org/community-spares-no-effort-to-reunite-lost-dog-with-owner-after-their-car-was-rolled-in-a-crash/",
      img:  "https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
