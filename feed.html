<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 449 · Sat, May 23, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Monday, May 25, 2026",
  edition: 451,
  stories: [
    {
      cat: "Nature",
      place: "Global Ocean",
      head: "Scientists aboard thirteen expeditions have formally described 1,121 previously unknown marine species in a single year — a 54 percent increase on last year's tally and the largest haul in the Ocean Census's three-year history.",
      dek:  "The Nippon Foundation-Nekton Ocean Census — a mission drawing more than 1,000 researchers from 85 countries — announced on 19 May that its third year of field work yielded 1,121 new species across expeditions into the Pacific, Southern, and Indian Oceans. Among the finds: a \"ghost shark\" chimaera detected at 820 metres depth in the Coral Sea off Australia, a carnivorous sponge nicknamed the \"death ball\" that ensnares crustaceans with microscopic velcro-like hooks near Antarctica, and a bristle worm living inside a translucent glass sponge on a Japanese volcanic seamount. With up to 90 percent of ocean species still undescribed, the Census is assembling the scientific baseline that marine managers need to know what exists before warming, trawling, or deep-sea mining can change it.",
      src:  "Nippon Foundation-Nekton Ocean Census / CNN / Scientific American",
      url:  "https://www.oceancensus.org/",
      img:  "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "Malawi, Sub-Saharan Africa",
      head: "A World Bank project in Malawi has brought electricity to nearly two million people — 25 percent more than its stated target — by combining new grid connections with 257,000 solar home systems in off-grid areas.",
      dek:  "The Malawi Electricity Access Project, a $100 million initiative completed this month after seven years of work, paired grid densification in peri-urban areas with market-based solar in rural communities, ultimately reaching 1.97 million people against a target of 1.6 million; the solar component alone exceeded its goal of 200,000 systems by 29 percent. In newly connected villages, small enterprises — phone-charging stands, evening tailors, cold-storage food sellers — emerged within months of connection, and the share of female-headed households with electricity rose significantly over the project's life. The results feed into Mission 300, the joint World Bank and African Development Bank campaign to connect 300 million sub-Saharan Africans to electricity by 2030.",
      src:  "World Bank",
      url:  "https://www.worldbank.org/en/country/malawi",
      img:  "https://images.unsplash.com/photo-1509391366360-2e959784a276?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Small Wonders",
      place: "Galápagos Islands, Ecuador",
      head: "Scientists formally described a vivid blue octopus discovered in the Galápagos, Microeledone galapagensis, noting its unusual blue-violet mantle as a likely signal of its isolation from mainland Pacific relatives.",
      dek:  "Scientists at the Field Museum in Chicago and the California Academy of Sciences published the description of Microeledone galapagensis in Zootaxa on 24 May, based on a specimen collected in 2015 by the research vessel Nautilus near Darwin Island in the remote northern Galápagos. The creature is small enough to curl in the palm of a hand, has unusually few suckers on its arms and a distinctive blue-violet mantle; the team used micro-CT scanning rather than dissection to confirm it belonged to a genus with no prior record from the Galápagos. It is the first new octopus species that researcher Janet Voight — who has studied octopus evolution for four decades — has officially led the formal description of.",
      src:  "Field Museum / Zootaxa",
      url:  "https://www.discoverwildlife.com/",
      img:  "https://images.unsplash.com/photo-1559825481-12a05cc00344?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Leeds, England",
      head: "Leeds' Mockingbird Family Model, which clusters foster families around a shared hub home, has cut annual carer deregistrations to 6 percent against a national average of 23 percent — keeping more children in stable homes.",
      dek:  "The Mockingbird Family Model — most densely established in Leeds, which now hosts nine constellations — organises foster families in groups of six to ten around a central hub home whose carers provide daily support, respite, and emergency overnight stays to the other families in their cluster. Independent evaluations show that only 6 percent of Mockingbird carers leave fostering annually, against 23 percent nationally, and families from all nine Leeds constellations gathered this fortnight to celebrate together during Foster Care Fortnight (12–25 May). The tenth hub is now forming.",
      src:  "Mockingbird Family Model UK / Public Sector Executive",
      url:  "https://www.mockingbirdsociety.org.uk/",
      img:  "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "Istanbul, Turkey",
      head: "A meta-analysis of fourteen clinical trials finds that walking 8,500 steps a day is linked to sustained weight maintenance — every additional thousand steps correlates with roughly 1.2 percent less weight regain.",
      dek:  "A team led by Professor Marwan El Ghoch of the University of Modena and Reggio Emilia pooled data from 3,758 overweight and obese adults across 14 randomised trials, finding that step count had little effect on initial weight loss but was strongly associated with keeping weight off over approximately eighteen months. Each additional 1,000 daily steps correlated with 1.1 to 1.3 percent greater weight maintenance, with the 8,500-step threshold emerging as the point above which the benefit levelled off for most participants. The findings were presented at the European Congress on Obesity in Istanbul in May and published in the International Journal of Environmental Research and Public Health.",
      src:  "University of Modena / ECO 2026 / ScienceDaily",
      url:  "https://www.sciencedaily.com/",
      img:  "https://images.unsplash.com/photo-1476480862126-209bfaa8edc8?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Everyday Joy",
      place: "Newport, Isle of Wight",
      head: "The National Gallery has taken thirty fine-detail prints of iconic works to Newport on the Isle of Wight, placing them beside supermarkets, high streets, and parks as part of its \"Art On Your Doorstep\" touring programme.",
      dek:  "The National Gallery's \"Art On Your Doorstep\" programme installed thirty fine-detail prints — each life-size, in its frame, with brushwork visible at close range — across Newport's town centre, parks, and community spaces from 6 May through 30 October 2026. Newport is one of seven UK locations hosting the tour this year; the three-year scheme aims to bring the national collection to twelve communities across all four nations of Britain, including stops already completed in Derry and Torquay. The works are placed where residents encounter them beside their ordinary days — outside a supermarket, on a high street, in a park — which is entirely the point.",
      src:  "National Gallery London / Positive News",
      url:  "https://www.positivenews.org.uk/",
      img:  "https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
