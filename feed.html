<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 446 · Thu, May 21, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Thursday, May 21, 2026",
  edition: 446,
  stories: [
    {
      cat: "Everyday Joy",
      place: "Sydney, Australia",
      head: "Vivid Sydney 2026 opens on Friday for twenty-three nights of free light installations along the harbour, and for the first time in the festival's sixteen-year history extends the programme into daylight hours.",
      dek:  "Vivid Sydney 2026 runs from Friday 22 May to 13 June across the CBD and harbour foreshore, featuring more than 200 illuminated works, drone shows, and live music — with an inaugural Day-Light series of daytime installations designed to work in natural sunlight, the first time the event has programmed for daylight in its sixteen-year history. The Vivid Light Walk, a free and unbroken 6.5-kilometre route from the Rocks to Pyrmont taking in the Opera House, the Harbour Bridge, and the Botanic Garden, runs every evening from 6 pm to 11 pm. More than 75 per cent of the festival's programme carries no entry charge, and drone shows run at 7.30 and 9.30 pm on Sundays through Wednesdays.",
      src:  "Vivid Sydney / NSW Government",
      url:  "https://www.vividsydney.com/",
      img:  "https://images.unsplash.com/photo-1470555060700-3a5773d42048?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "Cambridge, USA",
      head: "MIT scientists find that cysteine — an amino acid in eggs, meat, dairy, and pulses — activates an immune pathway that regenerates the intestinal lining, opening a new direction for cancer patients recovering from radiotherapy.",
      dek:  "Researchers at MIT have found that cysteine activates a population of CD8+ T cells, which release interleukin-22 — a signalling molecule that drives intestinal stem cell growth and tissue repair — making it the first single dietary compound shown to directly trigger this pathway, according to a study published in Nature on 20 May 2026. No individual nutrient had previously been identified as capable of stimulating this form of intestinal regeneration. Mice given a cysteine-rich diet recovered from radiation-induced intestinal damage measurably faster than controls, pointing towards potential dietary strategies for cancer patients receiving radiotherapy or chemotherapy.",
      src:  "MIT / Nature",
      url:  "https://www.sciencedaily.com/releases/2026/05/260520233223.htm",
      img:  "https://images.unsplash.com/photo-1576671081837-49000212a370?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "World Health Assembly, Geneva",
      head: "At the 79th World Health Assembly, WHO certified ten countries for eliminating mother-to-child transmission of HIV, syphilis, or hepatitis B — with Denmark as the first EU member state, and the Maldives the first country to clear all three diseases at once.",
      dek:  "On 19 May 2026, the WHO Secretariat presented certificates to Anguilla, Bahamas, Brazil, Cuba, Denmark, Maldives, Montserrat, Oman, Sri Lanka, and Turks and Caicos for eliminating perinatal transmission of HIV, hepatitis B, or syphilis, spanning four continents. Denmark is the first EU member state validated for both HIV and syphilis; the Maldives received its hepatitis B certificate, completing the world's first triple elimination — the only country to have cleared all three diseases from mother-to-child pathways simultaneously. The certifications cover countries ranging from Montserrat, home to fewer than 5,000 people, to Brazil, with 215 million.",
      src:  "WHO / World Health Assembly, Geneva",
      url:  "https://www.who.int/news/item/19-05-2026-seventy-ninth-world-health-assembly---daily-update--19-may-2026",
      img:  "https://images.unsplash.com/photo-1502003148287-a82ef80a6abc?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Small Wonders",
      place: "Northern Queensland, Australia",
      head: "A plant thought extinct since 1967 has reappeared in the Queensland outback, identified from a photograph uploaded to iNaturalist by a bird bander who noticed something unfamiliar growing between the baobabs.",
      dek:  "Ptilotus senarius, a slender shrub with feathery pink-purple flowers that grows only near Queensland's Gulf of Carpentaria, had not been formally collected since 1967 and was considered likely extinct. Aaron Bean, a professional horticulturalist banding birds on a remote station, photographed the unfamiliar plant and uploaded the images to iNaturalist; botanist Anthony Bean of the Queensland Herbarium recognised the species from the photograph within days. The plant is now listed as critically endangered, opening the path to targeted conservation for the small wild population found.",
      src:  "Queensland Herbarium / ScienceDaily",
      url:  "https://www.sciencedaily.com/releases/2026/05/260517211447.htm",
      img:  "https://images.unsplash.com/photo-1490750967868-88df5691cc35?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Nature",
      place: "Europe",
      head: "Thirteen youth-led pollinator conservation projects have been selected across Europe with EU funding and IUCN oversight, from biodiversity gardens in Romania to wet-meadow restoration for an endangered Spanish butterfly.",
      dek:  "The European Fund for Youth Action on Pollinators announced 13 new projects on 20 May 2026, with grants of up to 70,000 EUR for youth-led organisations working in EU member states. Projects include a youth-run pollinator garden in Romania built around traditional planting practices, a butterfly-habitat school programme in Germany, native-bee gardens in the Netherlands, and wet-meadow restoration in Castilla y León to support the dusky large blue butterfly. The fund, which runs until 2027, is one of the few European conservation grant programmes designed exclusively for organisations led by people aged 18 to 35.",
      src:  "IUCN / European Fund for Youth Action on Pollinators",
      url:  "https://iucn.org/news/202506/empowering-young-people-across-europe-protect-pollinators-and-address-biodiversity-loss",
      img:  "https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Mashonaland West, Zimbabwe",
      head: "In two of Zimbabwe's most remote districts, community health workers known as 'vaccine cyclists' ride bicycles from homestead to homestead and have immunised 22,000 girls against cervical cancer since the programme began.",
      dek:  "In Kariba and Hurungwe, village health workers ride bicycles along dusty footpaths, calling at scattered homesteads to offer HPV vaccinations to girls who would otherwise travel long distances to reach a clinic. The programme has immunised 22,000 girls against cervical cancer in Mashonaland West since it began, with each worker recording every household visit to track coverage across settlements separated by savanna, dry riverbeds, and baobab groves. Gavi, the Vaccine Alliance, and World Bicycle Relief have supplied bicycles and training, but the routes are navigated entirely by local community members who have known every path, and every family, for years.",
      src:  "Gavi / World Bicycle Relief",
      url:  "https://www.gavi.org/vaccineswork/rural-zimbabwe-vaccine-cyclists-brave-heat-dust-and-elephants-get-girls-protected",
      img:  "https://images.unsplash.com/photo-1601645191163-3fc0d5d64e35?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
