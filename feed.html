<!doctype html>
<html lang="en" data-palette="paper" data-mark="masthead">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f6f1e7" />
<title>Uplift — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:  oklch(97.8% 0.012 84);
  --ink:    oklch(22% 0.015 60);
  --soft:   #fff;
  --accent: oklch(58% 0.12 55);
  --shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
  --serif:  "Spectral", Georgia, serif;
  --sans:   "IBM Plex Sans", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
a { color: inherit; }

/* Top chrome — minimal, like an app */
.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  color: #fff;
  font-family: var(--sans);
  pointer-events: none;
}
.top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; }
.top .wordmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.top .wordmark .sun {
  display: inline-block;
  width: 0.5em; height: 0.25em;
  border-top-left-radius: 999px; border-top-right-radius: 999px;
  background: var(--accent);
  vertical-align: baseline; margin: 0 0.03em -0.02em;
}
.top-right { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.top-right a { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; }

/* Feed: stack of cards, one viewport-tall each, vertical snap */
.feed {
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex; align-items: stretch;
  background: #000;
  overflow: hidden;
}
.card .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.78) saturate(1.05);
  transform: scale(1.02);
}
.card .bg.placeholder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2c2419, #0c0a08);
}
.card .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
}

.card-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 720px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 88px 24px 110px;
  color: #fff;
}
.kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd9b0;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.kicker .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--accent); color: #0c0a08;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  letter-spacing: 0;
}
.headline {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  text-wrap: balance;
  text-shadow: 0 1px 24px rgba(0,0,0,0.45);
}
.dek {
  font-family: var(--serif);
  font-size: clamp(15px, 2.4vw, 17px);
  line-height: 1.5;
  color: rgba(255,255,255,0.86);
  margin: 0 0 20px;
  max-width: 38em;
  text-wrap: pretty;
}
.source-pill {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 999px;
  text-decoration: none;
  align-self: flex-start;
}
.source-pill:hover { background: rgba(255,255,255,0.22); }
.source-pill .arrow { color: var(--accent); }

/* Dot indicator at right edge */
.dots {
  position: fixed;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 15;
  pointer-events: none;
}
.dot {
  width: 4px; height: 18px; border-radius: 999px;
  background: rgba(255,255,255,0.35);
  transition: background 0.3s, height 0.3s;
}
.dot.is-active { background: #fff; height: 28px; }

/* Bottom bar — date + arrow up cue */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 12;
  padding: 18px 22px 24px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
  color: #fff;
  font-family: var(--sans);
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
.bottom .date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.bottom .hint { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
.bottom .hint .chev { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* Intro card (cover) */
.cover-inner {
  justify-content: center !important;
  text-align: center;
}
.cover-wordmark {
  font-family: var(--serif);
  font-size: clamp(54px, 14vw, 96px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  margin: 0 0 16px;
}
.cover-wordmark .sun { display: inline-block; width: 0.58em; height: 0.29em; border-top-left-radius: 999px; border-top-right-radius: 999px; background: var(--accent); vertical-align: baseline; margin: 0 0.04em -0.02em; }
.cover-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(17px, 2.6vw, 21px);
  color: rgba(255,255,255,0.85);
  margin: 0 0 28px;
}
.cover-meta {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}

/* Outro */
.outro-inner { justify-content: center !important; text-align: center; align-items: center; }
.outro-inner .headline { max-width: 14ch; }
.outro-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.outro-actions a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; color: #0c0a08; background: var(--accent);
}
.outro-actions a.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }
</style>
</head>
<body>

<!-- Top chrome -->
<div class="top" aria-hidden="false">
  <a class="wordmark" href="index.html">Upl<span class="sun"></span>ft</a>
  <div class="top-right">
    <a href="index.html">Paper</a>
    <a href="archive.html">Archive</a>
  </div>
</div>

<!-- Feed -->
<main class="feed" id="feed" data-screen-label="feed">
  <!-- cards injected by JS -->
</main>

<!-- Dot indicator -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- Bottom bar -->
<div class="bottom">
  <span class="date" id="bottom-date">Edition 449 · Sat, May 23, 2026</span>
  <span class="hint"><span class="chev">▲</span>swipe</span>
</div>

<script>
// Data — replaced daily by the workflow.
const TODAY = {
  date: "Saturday, May 23, 2026",
  edition: 449,
  stories: [
    {
      cat: "Small Wonders",
      place: "Iberá National Park, Argentina",
      head: "A young jaguar rests on a tourist trail in Argentina's Iberá Wetlands, the first encounter of its kind since the species vanished from the region more than seventy years ago.",
      dek:  "On a morning in early May, tour guides leading visitors through Iberá National Park in Corrientes came upon Ombú — an eighteen-month-old male jaguar born in the park — resting calmly on a public-use trail before rising and retreating quietly into the wetland forest. The park now supports more than fifty wild jaguars, all descendants of a reintroduction programme run by the Rewilding Argentina Foundation, which released its first animals in 2021; Corrientes is now the only Argentine province where jaguar numbers are increasing. The encounter is the first time tourists have filmed a free-roaming jaguar in the Esteros del Iberá since the species disappeared from the region in the 1950s, and is already drawing international conservation travellers to a wetland that, a decade ago, held none of the species at all.",
      src:  "Noticias Ambientales / Rewilding Argentina",
      url:  "https://noticiasambientales.com/animals/historic-encounter-with-ombu-tourists-film-a-jaguar-in-the-ibera-wetlands-for-the-first-time/",
      img:  "https://images.unsplash.com/photo-1564349683136-77e08dba1ef7?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Nature",
      place: "Namibia, Southern Africa",
      head: "Namibia secures a $63 million permanent conservation fund protecting 24 percent of the country's land and 87 communal wildlife areas in perpetuity.",
      dek:  "On 20 May, the Government of Namibia and WWF announced \"Namibia for Life,\" the first Project Finance for Permanence initiative on the African continent: a $63 million endowment permanently funding 87-plus communal conservancies across 24 percent of the country's land — a model credited with bringing lions, black rhinoceroses, and desert elephants back from local extinction and supporting livelihoods for 283,000 rural community members. The endowment, which may grow beyond $75 million through Green Climate Fund contributions, means communities receive conservation performance payments in perpetuity rather than through project cycles. Conservationists describe the structure as a template for community-led conservation financing across southern Africa.",
      src:  "WWF / Namibian Government",
      url:  "https://www.worldwildlife.org/news/press-releases/namibia-for-life-secures-historic-financing-win-for-community-led-conservation/",
      img:  "https://images.unsplash.com/photo-1547721064-da6cfb341d50?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Science & Medicine",
      place: "Istanbul, Turkey",
      head: "Patients who lose the most weight on GLP-1 drugs have 22 to 69 percent lower risk of developing sleep apnoea, kidney disease, and heart failure, a study of 90,000 patients finds.",
      dek:  "Presented at the European Congress on Obesity in Istanbul on 18 May, a real-world analysis of 89,718 patients prescribed semaglutide, tirzepatide, or liraglutide found that those with the greatest weight loss had 22 percent lower odds of obstructive sleep apnoea, 14 percent lower odds of chronic kidney disease, and 69 percent lower odds of heart failure compared with patients who gained weight on the drugs. Led by Professor John Wilding of the University of Liverpool, the study also found roughly half of patients discontinued medication within a year, pointing to adherence support as a critical next step. The findings add real-world evidence that GLP-1 drugs reduce serious co-morbidities, not merely body weight.",
      src:  "European Congress on Obesity / ScienceDaily",
      url:  "https://www.sciencedaily.com/releases/2026/05/260518041432.htm",
      img:  "https://images.unsplash.com/photo-1576091160550-2173dba999ef?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Quiet Kindness",
      place: "Chichester Harbour, England",
      head: "Two hundred and sixty volunteers spend five days returning 20,000 native oysters to Chichester Harbour in the UK's largest-ever subtidal reef restoration.",
      dek:  "From 11 to 15 May, volunteers at the University of Portsmouth's Institute of Marine Sciences cleaned and biosecurity-checked individual oysters before scientists deployed them on a newly constructed reef — the largest subtidal oyster reef restoration ever attempted in the UK, targeting a species whose population in the Solent has collapsed by roughly 96 percent over the past century. The project was led by the Blue Marine Foundation alongside Portsmouth researchers and the Chichester Harbour Conservancy. A single adult oyster filters up to 200 litres of water a day; with 20,000 now settling on the seabed, the reef is expected to improve water clarity and biodiversity across one of England's most protected coastal habitats.",
      src:  "Blue Marine Foundation / University of Portsmouth",
      url:  "https://www.goodnewsnetwork.org/over-200-volunteers-lead-largest-ever-oyster-reef-restoration-off-englands-portsmouth/",
      img:  "https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Everyday Joy",
      place: "Brooklyn, New York",
      head: "DanceAfrica 2026 brings Uganda's Ndere Troupe back to Brooklyn for the festival's forty-ninth year.",
      dek:  "Running 22–28 May at the Brooklyn Academy of Music, DanceAfrica — the longest-running African dance celebration in the United States — spotlights Uganda this year under the theme \"Umoja / Mirembe / Obulungi\" (Unity / Peace / Beauty), with the Ndere Troupe returning to BAM for the first time since 2007. The Asase Yaa African American Dance Theater joins to mark its 25th anniversary, and an outdoor Bazaar fills surrounding streets on 23–25 May with more than 150 vendors of African food, fabric, and craft. Tickets start at $25, with free community events, film screenings, and open dance classes throughout the week.",
      src:  "Brooklyn Academy of Music / Brooklyn Eagle",
      url:  "https://www.bam.org/dance/2026/danceafrica-2026",
      img:  "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=1600&q=80&auto=format&fit=crop"
    },
    {
      cat: "Global Progress",
      place: "Australia",
      head: "Australia is validated by the World Health Organization as having eliminated trachoma — the first high-income country ever to do so.",
      dek:  "The World Health Organization formally recognised Australia's elimination at the 79th World Health Assembly on 19 May, making it the first high-income country — and the 63rd nation globally — to eliminate any neglected tropical disease. Active trachoma prevalence among Aboriginal and Torres Strait Islander children aged 5–9 fell from 14.9 percent in 2009 to below the WHO threshold of 5 percent by 2024, driven by Aboriginal Community Controlled Health Organisations delivering two decades of surgery, antibiotics, facial hygiene promotion, and housing improvements. Post-validation surveillance systems remain embedded in national health infrastructure to protect the milestone.",
      src:  "World Health Organization / 79th World Health Assembly",
      url:  "https://www.who.int/news/item/29-04-2026-australia-becomes-the-30th-country-to-eliminate-trachoma-as-a-public-health-problem",
      img:  "https://images.unsplash.com/photo-1529114169-b2b4b2a7e84a?w=1600&q=80&auto=format&fit=crop"
    }
  ]
};

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");

// Cover card
feed.insertAdjacentHTML("beforeend", `
  <section class="card cover" aria-label="Cover">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80&auto=format&fit=crop')"
         onerror="this.classList.add('placeholder')"></div>
    <div class="scrim"></div>
    <div class="card-inner cover-inner">
      <h1 class="cover-wordmark">Upl<span class="sun"></span>ft</h1>
      <p class="cover-tag">Six good things, every morning.</p>
      <div class="cover-meta">Edition ${TODAY.edition} · ${TODAY.date}</div>
    </div>
  </section>
`);

TODAY.stories.forEach((s, i) => {
  feed.insertAdjacentHTML("beforeend", `
    <article class="card" aria-label="${s.head}">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim"></div>
      <div class="card-inner">
        <div class="kicker"><span class="num">${i + 1}</span>${s.cat} · ${s.place}</div>
        <h2 class="headline">${s.head}</h2>
        <p class="dek">${s.dek}</p>
        <a class="source-pill" href="${s.url}" target="_blank" rel="noopener">
          Read at ${s.src} <span class="arrow">→</span>
        </a>
      </div>
    </article>
  `);
});

// Outro
feed.insertAdjacentHTML("beforeend", `
  <section class="card outro" aria-label="Outro">
    <div class="bg" style="background:linear-gradient(160deg, #2c2419, #0c0a08)"></div>
    <div class="card-inner outro-inner">
      <div class="kicker"><span class="num" style="background:transparent;border:1px solid #ffd9b0;color:#ffd9b0">·</span>That's today's three.</div>
      <h2 class="headline">Same time tomorrow.</h2>
      <p class="dek" style="margin-bottom:28px">No notifications. No tracking pixels. No retention emails. Just a quiet page, every morning.</p>
      <div class="outro-actions">
        <a href="archive.html">Browse the archive</a>
        <a class="ghost" href="signup.html">Subscribe by email</a>
      </div>
    </div>
  </section>
`);

// Build dots
const cards = [...feed.querySelectorAll(".card")];
cards.forEach(() => dots.insertAdjacentHTML("beforeend", `<div class="dot"></div>`));
const dotEls = [...dots.children];

// Active-card tracking via IntersectionObserver
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting && e.intersectionRatio > 0.5) {
      const idx = cards.indexOf(e.target);
      dotEls.forEach((d, i) => d.classList.toggle("is-active", i === idx));
    }
  });
}, { root: feed, threshold: [0, 0.5, 1] });
cards.forEach((c) => io.observe(c));

// Initial state
if (dotEls[0]) dotEls[0].classList.add("is-active");

// Keyboard support
document.addEventListener("keydown", (e) => {
  const h = window.innerHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    feed.scrollBy({ top: h, behavior: "smooth" }); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" }); e.preventDefault();
  }
});
</script>
</body>
</html>
